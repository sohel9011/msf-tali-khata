<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>এমএস ফ্যাশন — টালি খাতা ও ইনভয়েস</title>
    <meta
      name="description"
      content="এমএস ফ্যাশন (MS Fashion)-এর ক্লাউড-সিঙ্কড ডিজিটাল টালি খাতা, সাপ্লায়ার ও কাস্টমার লেজার এবং অনলাইন ইনভয়েস সিস্টেম।"
    />
    <meta property="og:title" content="এমএস ফ্যাশন — টালি খাতা ও ইনভয়েস" />
    <meta
      property="og:description"
      content="এমএস ফ্যাশন (MS Fashion)-এর ক্লাউড-সিঙ্কড ডিজিটাল টালি খাতা, সাপ্লায়ার ও কাস্টমার লেজার এবং অনলাইন ইনভয়েস সিস্টেম।"
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f7f5;
        --surface: #ffffff;
        --surface-muted: #f8f9f7;
        --surface-pill: #f2f4f0;
        --border: #e5e8e3;
        --border-strong: #d4dad2;
        --text: #111815;
        --text-muted: #4b554e;
        --brand: #0d5c46;
        --brand-hover: #094534;
        --brand-soft: rgba(13, 92, 70, 0.1);
        --green: #15803d;
        --green-dot: #16a34a;
        --red: #b91c1c;
        --red-dot: #dc2626;
        --red-bg: #fef2f2;
        --red-border: #fecaca;
        --amber: #b45309;
        --amber-dot: #d97706;
        --amber-bg: #fffbeb;
        --amber-border: #fde68a;
        --font-sans: 'Hind Siliguri', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        font-family: var(--font-sans);
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
        overflow-x: hidden;
      }

      body {
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
        overflow-x: hidden;
      }

      button,
      input,
      select,
      textarea {
        font-family: inherit;
        touch-action: manipulation;
      }

      .mono {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 12px;
      }

      @media (min-width: 640px) {
        .container {
          padding: 0 24px;
        }
      }

      /* Header */
      .app-header {
        position: sticky;
        top: 0;
        z-index: 30;
        background: #ffffff;
        border-bottom: 1px solid #e5e5e5;
      }

      .header-inner {
        min-height: 58px;
        padding: 6px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      @media (min-width: 640px) {
        .header-inner {
          height: 64px;
          padding: 0;
          gap: 12px;
        }
      }

      .brand-btn {
        background: none;
        border: none;
        padding: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        text-align: left;
        flex-shrink: 0;
      }

      .brand-logo {
        width: 120px;
        height: auto;
        max-height: 44px;
        object-fit: contain;
        display: block;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      @media (max-width: 390px) {
        .header-actions .btn-sm {
          padding: 6px 9px;
          font-size: 11.5px;
          gap: 4px;
        }
      }

      .brand-sub {
        display: none;
        font-size: 11px;
        font-weight: 600;
        color: #171717;
        border-left: 1px solid #d4d4d4;
        padding-left: 12px;
      }

      @media (min-width: 640px) {
        .brand-sub {
          display: inline-block;
        }
      }

      .nav-tabs {
        display: none;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: #f5f5f5;
        border-radius: 12px;
      }

      @media (min-width: 768px) {
        .nav-tabs {
          display: inline-flex;
        }
      }

      .nav-tab {
        border: none;
        background: transparent;
        color: #525252;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background 0.15s, color 0.15s;
      }

      .nav-tab:hover {
        color: #000000;
      }

      .nav-tab.active {
        background: #ffffff;
        color: #000000;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }

      /* Mobile Fixed Bottom Navigation Bar (matching original bottom thumb-zone design) */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 40;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-top: 1px solid var(--border);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      @media (min-width: 768px) {
        .bottom-nav {
          display: none;
        }
      }

      .bottom-nav-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        height: 62px;
        align-items: center;
      }

      .bottom-nav-btn {
        border: none;
        background: transparent;
        height: 100%;
        padding: 4px 2px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 10.5px;
        font-weight: 600;
        transition: color 0.15s;
      }

      .bottom-nav-btn.active {
        color: var(--brand);
        font-weight: 700;
      }

      /* Buttons */
      .btn {
        min-height: 42px;
        padding: 8px 14px;
        border-radius: 12px;
        border: 1px solid transparent;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .btn-sm {
        min-height: 36px;
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 10px;
      }

      .btn-icon {
        min-height: 38px;
        min-width: 38px;
        padding: 6px;
        border-radius: 10px;
      }

      .btn-primary {
        background: var(--brand);
        color: #ffffff;
      }
      .btn-primary:hover {
        background: var(--brand-hover);
      }

      .btn-dark {
        background: #111815;
        color: #ffffff;
      }
      .btn-dark:hover {
        background: #1e293b;
      }

      .btn-secondary {
        background: #ffffff;
        color: var(--text);
        border-color: var(--border);
      }
      .btn-secondary:hover {
        background: var(--surface-pill);
      }

      .btn-soft {
        background: var(--surface-pill);
        color: var(--text);
      }
      .btn-soft:hover {
        background: var(--border);
      }

      .btn-brand-soft {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .btn-brand-soft:hover {
        background: rgba(13, 92, 70, 0.16);
      }

      .btn-danger-soft {
        background: var(--red-bg);
        color: var(--red);
        border-color: var(--red-border);
      }
      .btn-danger-soft:hover {
        background: #fee2e2;
      }

      .btn-danger {
        background: var(--red);
        color: #ffffff;
      }

      .btn-whatsapp {
        background: #15803d;
        color: #ffffff;
      }
      .btn-whatsapp:hover {
        background: #166534;
      }

      /* Layout Cards & Grids */
      .main-content {
        padding: 16px 0 calc(84px + env(safe-area-inset-bottom, 0px));
      }

      @media (min-width: 768px) {
        .main-content {
          padding: 24px 0 64px;
        }
      }

      .stack-lg > * + * {
        margin-top: 16px;
      }

      @media (min-width: 640px) {
        .stack-lg > * + * {
          margin-top: 24px;
        }
      }

      .stack-md > * + * {
        margin-top: 14px;
      }

      @media (min-width: 640px) {
        .stack-md > * + * {
          margin-top: 16px;
        }
      }

      .page-title {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.3;
      }

      @media (min-width: 640px) {
        .page-title {
          font-size: 25px;
        }
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 15px;
      }

      @media (min-width: 640px) {
        .card {
          padding: 20px;
        }
      }

      .card-flush {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      @media (max-width: 340px) {
        .kpi-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (min-width: 640px) {
        .kpi-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
        }
      }

      @media (min-width: 1024px) {
        .kpi-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      @media (min-width: 768px) {
        .grid-2 {
          grid-template-columns: repeat(2, 1fr);
          gap: 16px;
        }
      }

      .grid-3 {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      @media (min-width: 640px) {
        .grid-3 {
          grid-template-columns: repeat(3, 1fr);
          gap: 16px;
        }
      }

      .flex-between {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .flex-wrap {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .action-grid-mobile {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        width: 100%;
      }

      .action-grid-mobile .btn {
        width: 100%;
        padding: 8px 10px;
        font-size: 12px;
        white-space: normal;
        text-align: center;
        line-height: 1.25;
      }

      .action-grid-mobile .btn-span-2 {
        grid-column: span 2;
      }

      @media (min-width: 640px) {
        .action-grid-mobile {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          width: auto;
          gap: 8px;
        }
        .action-grid-mobile .btn {
          width: auto;
          padding: 8px 14px;
          font-size: 13px;
          white-space: nowrap;
        }
        .action-grid-mobile .btn-span-2 {
          grid-column: auto;
        }
      }

      .item-row-grid {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 10px;
        background: var(--surface-muted);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .item-row-grid .item-name-field {
        grid-column: 1 / -1;
      }

      @media (min-width: 640px) {
        .item-row-grid {
          grid-template-columns: 2fr 1fr 1fr auto;
          padding: 0;
          background: transparent;
          border: none;
          border-radius: 0;
        }
        .item-row-grid .item-name-field {
          grid-column: auto;
        }
      }

      .modal-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      @media (min-width: 640px) {
        .modal-actions {
          display: flex;
          justify-content: flex-end;
          gap: 8px;
        }
      }

      .kpi-label {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--text-muted);
        margin: 0;
      }

      @media (min-width: 640px) {
        .kpi-label {
          font-size: 12px;
        }
      }

      .kpi-val {
        font-size: clamp(16px, 4.4vw, 24px);
        font-weight: 700;
        margin: 6px 0 0;
        overflow-wrap: anywhere;
      }

      @media (min-width: 640px) {
        .kpi-val {
          margin-top: 8px;
        }
      }

      .kpi-sub {
        font-size: 11px;
        color: var(--text-muted);
        margin: 4px 0 0;
      }

      @media (min-width: 640px) {
        .kpi-sub {
          font-size: 12px;
          margin-top: 6px;
        }
      }

      .text-red {
        color: var(--red);
      }
      .text-green {
        color: var(--green);
      }
      .text-brand {
        color: var(--brand);
      }
      .text-amber {
        color: var(--amber);
      }
      .text-muted {
        color: var(--text-muted);
      }

      /* Inputs & Forms */
      .input,
      .select,
      .textarea {
        width: 100%;
        min-height: 42px;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface-muted);
        color: var(--text);
        font-size: 16px;
        outline: none;
        transition: border-color 0.15s, background 0.15s;
      }

      @media (min-width: 640px) {
        .input,
        .select,
        .textarea {
          font-size: 14px;
        }
      }

      .input:focus,
      .select:focus,
      .textarea:focus {
        border-color: var(--brand);
        background: #ffffff;
      }

      .textarea {
        min-height: 76px;
        resize: vertical;
      }

      .field-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .search-wrap {
        position: relative;
        width: 100%;
      }

      @media (min-width: 640px) {
        .search-wrap {
          max-width: 360px;
        }
        .search-wrap.search-compact-desktop {
          max-width: 260px;
        }
      }

      .search-wrap svg {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
      }

      .search-wrap .input {
        padding-left: 36px;
        background: #ffffff;
      }

      /* Lists & Tables */
      .list-divide > * + * {
        border-top: 1px solid var(--border);
      }

      .party-row {
        padding: 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: background 0.15s;
      }

      @media (min-width: 640px) {
        .party-row {
          padding: 16px 20px;
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          gap: 14px;
        }
      }

      .party-row:hover {
        background: var(--surface-muted);
      }

      .party-row-right {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }

      @media (min-width: 640px) {
        .party-row-right {
          width: auto;
          justify-content: flex-end;
          border-top: none;
          padding-top: 0;
          gap: 14px;
        }
      }

      .party-due-box {
        text-align: left;
      }

      @media (min-width: 640px) {
        .party-due-box {
          text-align: right;
        }
      }

      /* Mobile Stacked Ledger Cards */
      .mobile-card-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .mobile-tx-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 13px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .mobile-tx-metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        background: var(--surface-muted);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 12px;
      }

      .mobile-tx-metric-label {
        font-size: 10.5px;
        color: var(--text-muted);
      }

      /* Invoice Responsive */
      .invoice-card {
        max-width: 860px;
        margin: 0 auto;
        padding: 16px;
      }

      @media (min-width: 640px) {
        .invoice-card {
          padding: 32px;
        }
      }

      .invoice-meta-right {
        text-align: left;
      }

      @media (min-width: 768px) {
        .invoice-meta-right {
          text-align: right;
        }
      }

      .invoice-totals-box {
        width: 100%;
        font-size: 13.5px;
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }

      @media (min-width: 640px) {
        .invoice-totals-box {
          max-width: 300px;
        }
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        display: inline-block;
        flex-shrink: 0;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.4;
        border: 1px solid transparent;
        flex-shrink: 0;
      }
      .status-badge--active {
        background: #f0fdf4;
        color: #15803d;
        border-color: #bbf7d0;
      }
      .status-badge--overdue {
        background: #fef2f2;
        color: #b91c1c;
        border-color: #fecaca;
      }

      .table-wrap {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      table.ledger-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      table.ledger-table th {
        padding: 10px 10px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }

      table.ledger-table td {
        padding: 12px 10px;
        font-size: 13.5px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }

      table.ledger-table tr:last-child td {
        border-bottom: none;
      }

      .num-col {
        text-align: right !important;
        white-space: nowrap;
      }

      .pill-group {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: var(--surface-pill);
        border-radius: 12px;
        overflow-x: auto;
        max-width: 100%;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      .pill-group::-webkit-scrollbar {
        display: none;
      }

      .pill-btn {
        border: none;
        background: transparent;
        padding: 7px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        white-space: nowrap;
      }

      .pill-btn.active {
        background: #ffffff;
        color: var(--text);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }

      /* Login Page */
      .login-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }

      @media (min-width: 640px) {
        .login-shell {
          padding: 16px;
        }
      }

      .login-card {
        max-width: 960px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e5e5e5;
        border-radius: 20px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr;
      }

      @media (min-width: 900px) {
        .login-card {
          grid-template-columns: 1fr 1fr;
        }
      }

      .login-left {
        padding: 20px;
        border-bottom: 1px solid #e5e5e5;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 16px;
        min-height: auto;
      }

      .login-hero-img {
        width: 100%;
        max-width: 240px;
        max-height: 120px;
        object-fit: contain;
      }

      @media (min-width: 640px) {
        .login-left {
          padding: 36px;
          gap: 28px;
        }
        .login-hero-img {

      function esc(val) {
        return String(val ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function toBn(val) {
        return String(val ?? '').replace(/\d/g, (d) => BN_DIGITS[Number(d)] ?? d);
      }

      function formatTaka(amount) {
        const safe = Number.isFinite(Number(amount)) ? Number(amount) : 0;
        const neg = safe < 0;
        const formatted = Math.abs(safe).toLocaleString('en-IN', {
          maximumFractionDigits: 0,
        });
        return `${neg ? '-' : ''}৳ ${formatted}`;
      }

      function formatDateBn(isoDate) {
        if (!isoDate) return '';
        const parts = isoDate.split('-');
        if (parts.length !== 3) return isoDate;
        const [y, m, d] = parts;
        const mLabel = MONTHS_SHORT_BN[Number(m) - 1] || m;
        return `${toBn(Number(d))} ${mLabel} ${toBn(y)}`;
      }

      function formatMonthBn(monthKey) {
        if (!monthKey) return '';
        const [y, m] = monthKey.split('-');
        const mLabel = MONTHS_FULL_BN[Number(m) - 1] || m;
        return `${mLabel} ${toBn(y)}`;
      }

      function formatShortMonthBn(monthKey) {
        const [y, m] = monthKey.split('-');
        const mLabel = MONTHS_SHORT_BN[Number(m) - 1] || m;
        return `${mLabel} '${toBn((y || '').slice(-2))}`;
      }

          clean = `88${digits}`;

      function showToast(text, kind = 'success') {

      async function copyText(text, successMsg) {

          showToast('কপি করা যায়নি।', 'error');

      }

      // --- Firestore Computations & Writes ---
      function generateDocId(col) {
        return doc(collection(db, col)).id;
      }

      function generateInvoiceNo(type) {
        const prefix =
          type === 'customer_sale'
            ? 'MSF'
            : type === 'supplier_purchase'
              ? 'PUR'
              : type === 'supplier_due_add' || type === 'customer_due_add'
                ? 'DUE'
                : 'PAY';
        let maxNum = 1000;
        for (const tx of state.transactions) {
          const m = String(tx.invoiceNo || '').match(/(\d+)$/);
          if (m) {
            const n = Number(m[1]);
            if (Number.isFinite(n) && n >= maxNum) maxNum = n;
          }
        }
        return `${prefix}-${maxNum + 1}`;
      }

      function buildEntrySummary(tx) {
        if (tx.type === 'supplier_payment') {
          return `পেমেন্ট পরিশোধ (${tx.paymentMethod || 'নগদ'})${tx.note ? ` · ${tx.note}` : ''}`;
        }
        if (tx.type === 'supplier_due_add') {
          return `${tx.note || 'আগের বাকি / প্রোডাক্ট ছাড়া টাকা নেওয়া'} (${tx.paymentMethod || 'নগদ'})`;
        }
        if (tx.type === 'customer_due_add') {
          return `${tx.note || 'আগের বাকি / সরাসরি পাওনা যোগ'} (${tx.paymentMethod || 'নগদ'})`;
        }
        if (tx.type === 'customer_payment') {
          return `টাকা আদায় (${tx.paymentMethod || 'নগদ'})${tx.note ? ` · ${tx.note}` : ''}`;
        }
        if (!tx.items || tx.items.length === 0) {
          return tx.note || (tx.type === 'customer_sale' ? 'বিক্রি ইনভয়েস' : 'মাল ক্রয়');
        }
        return tx.items
          .map((it) => `${it.name} (${it.qty} পিস × ৳${it.unitPrice})`)
          .join(', ')
          .slice(0, 220);
      }

      function computePartyLedger(partyTxs) {
        const sorted = [...partyTxs].sort((a, b) => {
          const d = (a.date || '').localeCompare(b.date || '');
          if (d !== 0) return d;
          const aMs = a.createdAt instanceof Timestamp ? a.createdAt.toMillis() : 0;
          const bMs = b.createdAt instanceof Timestamp ? b.createdAt.toMillis() : 0;
          if (aMs !== bMs) return aMs - bMs;
          return (a.id || '').localeCompare(b.id || '');
        });

        let totalBilled = 0;
        let totalPaid = 0;
        let runningBalance = 0;
        const entries = [];

        for (const tx of sorted) {
          const isBill =
            tx.type === 'supplier_purchase' ||
            tx.type === 'customer_sale' ||
            tx.type === 'supplier_due_add' ||
            tx.type === 'customer_due_add';
          const debit = isBill ? Number(tx.totalAmount || 0) : 0;
          const credit = Number(tx.paidAmount || 0);
          totalBilled += debit;
          totalPaid += credit;
          runningBalance += debit - credit;

          entries.push({
            txId: tx.id,
            date: tx.date,
            type: tx.type,
            invoiceNo: tx.invoiceNo,
            summary: buildEntrySummary(tx),
            items: tx.items || [],
            subtotal: tx.subtotal || 0,
            discount: tx.discount || 0,
            totalAmount: tx.totalAmount || 0,
            paidAmount: tx.paidAmount || 0,
            dueAmount: tx.dueAmount || 0,
            paymentMethod: tx.paymentMethod || 'নগদ',
            note: tx.note || '',
            debit,
            credit,
            runningBalance,
          });
        }

        return {
          totalBilled,
          totalPaid,
          currentDue: totalBilled - totalPaid,
          entries: entries.slice(-BLUEPRINT_LIMITS.ENTRIES_MAX),
        };
      }

      function computePersonLedger(personTxs) {
        const sorted = [...personTxs].sort((a, b) => {
          const d = (a.date || '').localeCompare(b.date || '');
          if (d !== 0) return d;
          const aMs = a.createdAt instanceof Timestamp ? a.createdAt.toMillis() : 0;
          const bMs = b.createdAt instanceof Timestamp ? b.createdAt.toMillis() : 0;
          if (aMs !== bMs) return aMs - bMs;
          return (a.id || '').localeCompare(b.id || '');
        });

        let totalPayable = 0;
        let totalGiven = 0;
        let runningBalance = 0;
        const entries = [];

        for (const tx of sorted) {
          const payableAmount = tx.type === 'payable_add' ? Number(tx.amount || 0) : 0;
          const givenAmount = tx.type === 'payment_given' ? Number(tx.amount || 0) : 0;
          totalPayable += payableAmount;
          totalGiven += givenAmount;
          runningBalance += payableAmount - givenAmount;

          entries.push({
            ptxId: tx.id,
            date: tx.date,
            type: tx.type,
            purpose: tx.purpose,
            paymentMethod: tx.paymentMethod || 'নগদ',
            note: tx.note || '',
            payableAmount,
            givenAmount,
            runningBalance,
          });
        }

        return {
          totalPayable,
          totalGiven,
          currentBalance: totalPayable - totalGiven,
          entries: entries.slice(-BLUEPRINT_LIMITS.ENTRIES_MAX),
        };
      }

        for (const unsub of state.unsubs) {
          try {
            unsub();
          } catch {}
        }
        state.unsubs = [];
      }

      function attachAdminListeners() {
        clearListeners();
        state.dataLoading = true;
        let loaded = 0;
        const mark = () => {
          loaded += 1;
          if (loaded >= 6) {
            state.dataLoading = false;
            if (!state.seededPersonsChecked && state.persons.length === 0) {
              state.seededPersonsChecked = true;
              void seedDefaultPersonsIfEmpty();
            }
            render();
          }
        };

        state.unsubs.push(
          onSnapshot(
            collection(db, 'suppliers'),
            (snap) => {
              state.suppliers = snap.docs
                .map((d) => d.data())
                .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'bn'));
              mark();
              if (!state.dataLoading) render();
            },
            (err) => handleFirestoreError(err, 'list', 'suppliers'),
          ),
        );

        state.unsubs.push(
          onSnapshot(
            collection(db, 'customers'),
            (snap) => {
              state.customers = snap.docs
                .map((d) => d.data())
                .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'bn'));
              mark();
              if (!state.dataLoading) render();
            },
            (err) => handleFirestoreError(err, 'list', 'customers'),
          ),
        );

        state.unsubs.push(
          onSnapshot(
            collection(db, 'transactions'),
            (snap) => {
              state.transactions = snap.docs
                .map((d) => d.data())
                .sort((a, b) => {
                  const dCmp = (b.date || '').localeCompare(a.date || '');
                  if (dCmp !== 0) return dCmp;
                  const aMs = a.createdAt instanceof Timestamp ? a.createdAt.toMillis() : 0;
                  const bMs = b.createdAt instanceof Timestamp ? b.createdAt.toMillis() : 0;
                  return bMs - aMs;
                });
              mark();
              if (!state.dataLoading) render();
            },
            (err) => handleFirestoreError(err, 'list', 'transactions'),

        state.unsubs.push(

      async function loadPublicPortalData() {
        const q = state.queryParams;
        const target = q.customer
          ? { col: 'publicCustomerLedgers', id: q.customer, kind: 'ledger' }
          : q.supplier
            ? { col: 'publicSupplierLedgers', id: q.supplier, kind: 'ledger' }
            : q.invoice
              ? { col: 'publicInvoices', id: q.invoice, kind: 'invoice' }
              : q.person
                ? { col: 'publicPersonLedgers', id: q.person, kind: 'person' }
                : null;
        if (!target) return;

        state.publicLoading = true;
        state.publicError = null;
        render();

        try {
          const snap = await getDoc(doc(db, target.col, target.id));
          if (!snap.exists()) {
            state.publicError = 'দুঃখিত, এই হিসাব বা ইনভয়েসটি খুঁজে পাওয়া যায়নি।';
            state.publicDoc = null;
          } else {
            state.publicDoc = { kind: target.kind, data: snap.data() };
          }
        } catch (err) {
          console.error(err);
          state.publicError = 'তথ্য লোড করতে সমস্যা হয়েছে।';
        } finally {
          state.publicLoading = false;
          render();
        }
      }

      function isPublicRoute() {
        const q = state.queryParams;
        return Boolean(q.customer || q.supplier || q.invoice || q.person);
      }

      // --- Auth Listener ---
      onAuthStateChanged(auth, async (currentUser) => {
        state.user = currentUser;
        if (!currentUser) {
          state.isAdmin = false;
          state.authReady = true;
          clearListeners();
          render();
          return;
        }

        if (
          currentUser.emailVerified &&
          currentUser.email &&
          currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()
        ) {
          state.isAdmin = true;
          state.authReady = true;
          if (!isPublicRoute()) attachAdminListeners();
          render();
          return;
        }

        try {
          const adminDoc = await getDoc(doc(db, 'admins', currentUser.uid));
          state.isAdmin = Boolean(currentUser.emailVerified && adminDoc.exists());
        } catch {
          state.isAdmin = false;
        } finally {
          state.authReady = true;
          if (state.isAdmin && !isPublicRoute()) attachAdminListeners();
          render();
        }
      });

      if (isPublicRoute()) {
        void loadPublicPortalData();
      }

      // --- Derived Summary ---
      function getSummary() {
        const totalSupplierDue = state.suppliers.reduce((s, x) => s + Number(x.currentDue || 0), 0);
        const totalCustomerDue = state.customers.reduce((s, x) => s + Number(x.currentDue || 0), 0);
        const totalPurchases = state.transactions
          .filter((t) => t.type === 'supplier_purchase')
          .reduce((s, t) => s + Number(t.totalAmount || 0), 0);
        const totalSales = state.transactions
          .filter((t) => t.type === 'customer_sale')
          .reduce((s, t) => s + Number(t.totalAmount || 0), 0);
        const currentMonth = getCurrentMonthKey();
        const monthlyHomeExpense = state.homeExpenses
          .filter((h) => h.monthKey === currentMonth)
          .reduce((s, h) => s + Number(h.totalAmount || 0), 0);
        const staffBalanceDue = state.persons.reduce(
          (s, p) => s + Math.max(0, Number(p.currentBalance || 0)),
          0,
        );
        return {
          totalSupplierDue,
          totalCustomerDue,
          totalPurchases,
          totalSales,
          monthlyHomeExpense,
          staffBalanceDue,
          currentMonth,
        };
      }

      // --- Chart Builder (Pure SVG) ---
      function buildMonthlyChartHtml() {
        const map = new Map();
        let latestMonth = getCurrentMonthKey();

        for (const tx of state.transactions) {
          if (tx.type !== 'supplier_purchase' && tx.type !== 'customer_sale') continue;
          const mk = String(tx.date || '').slice(0, 7);
          if (mk.length !== 7) continue;
          if (mk > latestMonth) latestMonth = mk;
          const cur = map.get(mk) || { purchases: 0, sales: 0 };
          if (tx.type === 'supplier_purchase') cur.purchases += Number(tx.totalAmount || 0);
          else cur.sales += Number(tx.totalAmount || 0);
          map.set(mk, cur);
        }

        const [yStr, mStr] = latestMonth.split('-');
        const endYear = Number(yStr) || new Date().getFullYear();
        const endMonth = Number(mStr) || new Date().getMonth() + 1;
        const count = state.chartRangeMonths;
        const keys = [];
        for (let i = count - 1; i >= 0; i--) {
          let tm = endMonth - i;
          let ty = endYear;
          while (tm <= 0) {
            tm += 12;
            ty -= 1;
          }
          keys.push(`${ty}-${String(tm).padStart(2, '0')}`);
        }

        let rangePurchases = 0;
        let rangeSales = 0;
        const data = keys.map((mk) => {
          const e = map.get(mk) || { purchases: 0, sales: 0 };
          rangePurchases += e.purchases;
          rangeSales += e.sales;
          return {
            mk,
            shortLabel: formatShortMonthBn(mk),
            fullLabel: formatMonthBn(mk),
            purchases: Math.round(e.purchases),
            sales: Math.round(e.sales),
          };
        });

        const hasData = rangePurchases > 0 || rangeSales > 0;
        const maxVal = Math.max(1000, ...data.map((d) => Math.max(d.purchases, d.sales)));

        let bodyHtml = '';
        if (state.dataLoading) {
          bodyHtml = `<div style="height:260px;background:#f8f9f7;border-radius:12px;"></div>`;
        } else if (!hasData) {
          bodyHtml = `
            <div class="empty-box">
              <strong>এই সময়ে এখনো কোনো মাল ক্রয় বা বিক্রির হিসাব পাওয়া যায়নি</strong>
              <p style="margin:6px 0 0;font-size:12px;">নতুন সাপ্লায়ার ক্রয় বা কাস্টমার বিক্রি যোগ করলে এখানে মাসিক তুলনামূলক বার চার্ট দেখা যাবে।</p>
            </div>
          `;
        } else {
          const svgW = Math.max(620, count * 76);
          const svgH = 260;
          const padL = 56;
          const padR = 16;
          const padT = 16;
          const padB = 34;
          const plotW = svgW - padL - padR;
          const plotH = svgH - padT - padB;
          const groupW = plotW / data.length;
          const barW = Math.min(26, Math.max(10, groupW * 0.28));

          const gridLines = [0, 0.25, 0.5, 0.75, 1]
            .map((ratio) => {
              const y = padT + plotH * (1 - ratio);
              const val = Math.round(maxVal * ratio);
              const label =
                val === 0
                  ? '৳০'
                  : val >= 100000
                    ? `৳${toBn((val / 100000).toFixed(1).replace(/\.0$/, ''))}লাখ`
                    : val >= 1000
                      ? `৳${toBn((val / 1000).toFixed(1).replace(/\.0$/, ''))}হা`
                      : `৳${toBn(val)}`;
              return `
                <line x1="${padL}" y1="${y}" x2="${svgW - padR}" y2="${y}" stroke="#e5e8e3" stroke-dasharray="3 3" />
                <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#4b554e">${esc(label)}</text>
              `;
            })
            .join('');

          const bars = data
            .map((d, idx) => {
              const cx = padL + groupW * idx + groupW / 2;
              const pH = Math.max(d.purchases > 0 ? 3 : 0, (d.purchases / maxVal) * plotH);
              const sH = Math.max(d.sales > 0 ? 3 : 0, (d.sales / maxVal) * plotH);
              const pX = cx - barW - 3;
              const sX = cx + 3;
              const pY = padT + plotH - pH;
              const sY = padT + plotH - sH;
              return `
                <g class="chart-bar-group"
                   data-month="${esc(d.fullLabel)}"
                   data-purchases="${d.purchases}"
                   data-sales="${d.sales}">
                  <rect x="${cx - groupW / 2}" y="${padT}" width="${groupW}" height="${plotH}" fill="transparent" />
                  <rect x="${pX}" y="${pY}" width="${barW}" height="${pH}" rx="4" fill="#1e293b" />
                  <rect x="${sX}" y="${sY}" width="${barW}" height="${sH}" rx="4" fill="#0d5c46" />
                  <text x="${cx}" y="${svgH - 10}" text-anchor="middle" font-size="11.5" font-weight="500" fill="#4b554e">${esc(d.shortLabel)}</text>
                </g>
              `;
            })
            .join('');

          bodyHtml = `
            <div class="chart-wrap" id="monthly-chart-wrap">
              <div class="chart-tooltip" id="chart-tooltip"></div>
              <svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;min-width:${count === 12 ? 560 : 320}px;height:250px;display:block;">
                ${gridLines}
                ${bars}
              </svg>
            </div>
          `;
        }

        return `
          <section class="card stack-md">
            <div class="flex-between">
              <div>
                <h2 style="margin:0;font-size:18px;font-weight:700;">মাসিক কেনাকাটা ও বিক্রয়ের তুলনামূলক চিত্র</h2>
                <p style="margin:4px 0 0;font-size:12px;color:var(--text-muted);">
                  গত ${toBn(count)} মাসের মোট ক্রয় (<strong class="mono">${esc(formatTaka(rangePurchases))}</strong>) বনাম মোট বিক্রি (<strong class="mono text-brand">${esc(formatTaka(rangeSales))}</strong>)
                </p>
              </div>
              <div class="flex-wrap">
                <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;">
                  <span style="width:10px;height:10px;border-radius:2px;background:#1e293b;display:inline-block;"></span> মোট কেনাকাটা
                </span>
                <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-right:8px;">
                  <span style="width:10px;height:10px;border-radius:2px;background:#0d5c46;display:inline-block;"></span> মোট বিক্রি
                </span>
                <div class="pill-group">
                  <button type="button" class="pill-btn ${count === 6 ? 'active' : ''}" data-action="chart-range" data-range="6">গত ৬ মাস</button>
                  <button type="button" class="pill-btn ${count === 12 ? 'active' : ''}" data-action="chart-range" data-range="12">গত ১২ মাস</button>
                </div>
              </div>
            </div>
            ${bodyHtml}
          </section>
        `;
      }

              blocks.push(
                `<div style="font-size:13px;font-weight:700;margin-bottom:6px;">${esc(title)}</div><div style="border:1px dashed #d4dad2;padding:12px;border-radius:8px;font-size:11px;color:#4b554e;text-align:center;">${esc(emptyMsg)}</div>`,
              );
              return;
            }
            blocks.push(`
              <div style="font-size:13px;font-weight:700;margin-bottom:6px;">${esc(title)}</div>
              <table style="width:100%;border-collapse:collapse;font-size:11px;border:1px solid #e5e8e3;">
                <thead><tr style="background:#f2f4f0;">${headers}</tr></thead>
                <tbody>${rowsHtml}</tbody>

            `১. চলতি মাসের বিক্রি (${monthTitle})`,

            salesTxs
              .slice(0, 25)
              .map(
                (t) =>
                  `<tr style="border-top:1px solid #eef0ec;"><td style="padding:6px 8px;">${esc(formatDateBn(t.date))}</td><td style="padding:6px 8px;">${esc(t.invoiceNo)}</td><td style="padding:6px 8px;">${esc(t.partyName)}</td><td style="padding:6px 8px;text-align:right;">${esc(formatTaka(t.totalAmount))}</td><td style="padding:6px 8px;text-align:right;">${esc(formatTaka(t.paidAmount))}</td><td style="padding:6px 8px;text-align:right;">${esc(formatTaka(t.dueAmount))}</td></tr>`,
              )
              .join(''),
            'এই মাসে এখনো কোনো বিক্রি হয়নি।',
          );

          addTableBlock(
            `২. চলতি মাসের কেনাকাটা (${monthTitle})`,
            `<th style="padding:6px 8px;text-align:left;">তারিখ</th><th style="padding:6px 8px;text-align:left;">চালান</th><th style="padding:6px 8px;text-align:left;">সাপ্লায়ার</th><th style="padding:6px 8px;text-align:right;">মোট বিল</th><th style="padding:6px 8px;text-align:right;">পরিশোধ</th><th style="padding:6px 8px;text-align:right;">বাকি</th>`,
            purTxs
              .slice(0, 25)
              .map(
                (t) =>
                  `<tr style="border-top:1px solid #eef0ec;"><td style="padding:6px 8px;">${esc(formatDateBn(t.date))}</td><td style="padding:6px 8px;">${esc(t.invoiceNo)}</td><td style="padding:6px 8px;">${esc(t.partyName)}</td><td style="padding:6px 8px;text-align:right;">${esc(formatTaka(t.totalAmount))}</td><td style="padding:6px 8px;text-align:right;">${esc(formatTaka(t.paidAmount))}</td><td style="padding:6px 8px;text-align:right;">${esc(formatTaka(t.dueAmount))}</td></tr>`,
              )
              .join(''),
            'এই মাসে এখনো কোনো কেনাকাটা হয়নি।',
          );

          const expRows = [
            ...mHome.map((h) => ({
              date: h.date,
              cat: 'বাসার খরচ',
              desc: h.title,
              amt: h.totalAmount,
            })),
            ...mPerson.map((p) => ({
              date: p.date,
              cat: p.personName,
              desc: p.purpose,
              amt: p.amount,
            })),
          ]
            .sort((a, b) => (a.date || '').localeCompare(b.date || ''))
            .slice(0, 25)
            .map(
              (r) =>
                `<tr style="border-top:1px solid #eef0ec;"><td style="padding:6px 8px;">${esc(formatDateBn(r.date))}</td><td style="padding:6px 8px;">${esc(r.cat)}</td><td style="padding:6px 8px;">${esc(r.desc)}</td><td style="padding:6px 8px;text-align:right;">${esc(formatTaka(r.amt))}</td></tr>`,
            )
            .join('');

          addTableBlock(
            `৩. চলতি মাসের বাসা ও অন্যান্য খরচ (${monthTitle})`,
            `<th style="padding:6px 8px;text-align:left;">তারিখ</th><th style="padding:6px 8px;text-align:left;">খাত / ব্যক্তি</th><th style="padding:6px 8px;text-align:left;">বিবরণ</th><th style="padding:6px 8px;text-align:right;">পরিমাণ</th>`,
            expRows,
            'এই মাসে কোনো বাসা বা ব্যক্তিগত খরচ নেই।',
          );

          const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
          const pw = pdf.internal.pageSize.getWidth();
          const ph = pdf.internal.pageSize.getHeight();
          const margin = 8;
          const uw = pw - margin * 2;
          let cy = margin;

          for (const html of blocks) {
            const canvas = await renderBlock(html);
            const bh = (canvas.height * uw) / canvas.width;
            if (cy > margin && cy + bh > ph - margin) {
              pdf.addPage();
              cy = margin;
            }
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', margin, cy, uw, Math.min(bh, ph - margin * 2));
            cy += bh - 3;
          }

          pdf.save(`MS-Fashion-Monthly-Report-${monthKey}.pdf`);
          showToast(`${monthTitle} মাসের রিপোর্ট PDF ডাউনলোড হয়েছে!`);
        } catch (err) {
          console.error(err);
          showToast('PDF তৈরি করতে সমস্যা হয়েছে।', 'error');
        } finally {
          state.pdfExporting = false;
          render();
        }
      }

      function renderSuppliers() {
        const sum = getSummary();
        const q = state.searchQuery.trim().toLowerCase();
        const list = q
          ? state.suppliers.filter(
              (s) =>
                String(s.name || '').toLowerCase().includes(q) ||
                String(s.phone || '').toLowerCase().includes(q) ||
                String(s.address || '').toLowerCase().includes(q),
            )
          : state.suppliers;

        const lastDateMap = {};
        for (const tx of state.transactions) {
          if (
            tx.type === 'supplier_purchase' ||
            tx.type === 'supplier_payment' ||
            tx.type === 'supplier_due_add'
          ) {
            if (tx.partyId && tx.date && (!lastDateMap[tx.partyId] || tx.date > lastDateMap[tx.partyId])) {
              lastDateMap[tx.partyId] = tx.date;
            }
          }
        }

        const cardsHtml = list
          .map((sup) => {
            const lastDate = lastDateMap[sup.id];
            const isOverdue = Number(sup.currentDue || 0) > 0;
            const dotColor = isOverdue ? '#dc2626' : '#16a34a';
            const badgeClass = isOverdue ? 'status-badge--overdue' : 'status-badge--active';
            const statusText = isOverdue ? 'Overdue' : 'Active';
            const statusTitle = isOverdue ? 'বকেয়া আছে' : 'হিসাব সক্রিয় / পরিশোধিত';
            const lastDateText = lastDate ? esc(formatDateBn(String(lastDate).slice(0, 10))) : 'নেই';
            return `
              <div class="party-row">
                <button type="button" style="background:none;border:none;padding:0;text-align:left;flex:1;min-width:0;cursor:pointer;" data-action="open-party" data-type="supplier" data-id="${esc(sup.id)}">
                  <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;">
                    <strong style="font-size:16px;color:var(--text);">${esc(sup.name)}</strong>
                    <span style="display:inline-flex;align-items:center;gap:6px;flex-shrink:0;">
                      <span class="status-dot" aria-hidden="true" style="width:7px;height:7px;background:${dotColor};opacity:0.85;"></span>
                      <span class="status-badge ${badgeClass}" title="${statusTitle}">${statusText}</span>
                    </span>
                    ${ICONS.chevron}
                  </div>
                  <div style="font-size:11.5px;color:#6b7280;margin-top:3px;line-height:1.4;">
                    সর্বশেষ লেনদেন: ${lastDateText}
                  </div>
                  <div style="font-size:12px;color:var(--text-muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;">
                    ${sup.phone ? `<span class="mono">${esc(sup.phone)}</span><span>·</span>` : ''}
                    ${sup.address ? `<span>${esc(sup.address)}</span><span>·</span>` : ''}
                    <span>মোট কেনাকাটা: <span class="mono">${esc(formatTaka(sup.totalBilled))}</span></span>
                  </div>
                </button>
                <div class="party-row-right">
                  <div class="party-due-box">
                    <div style="font-size:11px;color:var(--text-muted);display:inline-flex;align-items:center;gap:6px;">
                      <span class="status-dot" style="background:${dotColor};"></span> বর্তমান বাকি
                    </div>
                    <div class="mono ${sup.currentDue > 0 ? 'text-red' : 'text-green'}" style="font-size:16px;font-weight:700;">${esc(formatTaka(sup.currentDue))}</div>
                  </div>
                  <div class="flex-wrap">
                    <button type="button" class="btn btn-soft btn-icon" title="শেয়ার লিংক কপি" data-action="copy-url" data-param="supplier" data-id="${esc(sup.id)}">${ICONS.copy}</button>
                    <button type="button" class="btn btn-brand-soft btn-sm" data-action="open-party" data-type="supplier" data-id="${esc(sup.id)}">খাতা দেখুন</button>
                  </div>
                </div>
              </div>
            `;
          })
          .join('');

        return `
          <div class="stack-lg">
            <div class="flex-between">
              <div>
                <h1 class="page-title">সাপ্লায়ার খাতা (${toBn(state.suppliers.length)})</h1>
                <p style="margin:4px 0 0;font-size:13.5px;color:var(--text-muted);">মোট সাপ্লায়ার বাকি: <strong class="mono text-red">${esc(formatTaka(sum.totalSupplierDue))}</strong></p>
              </div>
              <div class="action-grid-mobile">
                <button type="button" class="btn btn-secondary" data-action="new-party" data-type="supplier">${ICONS.plus} নতুন সাপ্লায়ার</button>
                <button type="button" class="btn btn-danger-soft" data-action="new-tx" data-type="supplier_due_add">${ICONS.plus} আগের বাকি / টাকা</button>
                <button type="button" class="btn btn-brand-soft" data-action="new-tx" data-type="supplier_payment">${ICONS.plus} পেমেন্ট পরিশোধ</button>
                <button type="button" class="btn btn-primary" data-action="new-tx" data-type="supplier_purchase">${ICONS.plus} মাল ক্রয় এন্ট্রি</button>
              </div>
            </div>
            <div class="search-wrap">
              ${ICONS.search}
              <input type="search" class="input" id="global-search" value="${esc(state.searchQuery)}" placeholder="সাপ্লায়ারের নাম বা মোবাইল নম্বর খুঁজুন..." />
            </div>
            <div class="card-flush">
              ${list.length === 0 ? `<div class="empty-box" style="margin:16px;">কোনো সাপ্লায়ার পাওয়া যায়নি।</div>` : `<div class="list-divide">${cardsHtml}</div>`}
            </div>
          </div>
        `;
      }

      function renderCustomers() {
        const sum = getSummary();
        const q = state.searchQuery.trim().toLowerCase();
        const custList = q
          ? state.customers.filter(
              (c) =>
                String(c.name || '').toLowerCase().includes(q) ||
                String(c.phone || '').toLowerCase().includes(q) ||
                String(c.address || '').toLowerCase().includes(q),
            )
          : state.customers;

        const invList = state.transactions.filter((tx) => {
          if (tx.type !== 'customer_sale') return false;
          if (!q) return true;
          return (
            String(tx.partyName || '').toLowerCase().includes(q) ||
            String(tx.partyPhone || '').toLowerCase().includes(q) ||
            String(tx.invoiceNo || '').toLowerCase().includes(q)
          );
        });

        const content =
          state.customerSubTab === 'customers'
            ? custList.length === 0
              ? `<div class="empty-box" style="margin:16px;">কোনো কাস্টমার পাওয়া যায়নি।</div>`
              : `<div class="list-divide">${custList
                  .map(
                    (c) => `
                  <div class="party-row">
                    <button type="button" style="background:none;border:none;padding:0;text-align:left;flex:1;min-width:0;cursor:pointer;" data-action="open-party" data-type="customer" data-id="${esc(c.id)}">
                      <div style="display:flex;align-items:center;gap:6px;"><strong style="font-size:16px;">${esc(c.name)}</strong>${ICONS.chevron}</div>

                        ${c.phone ? `<span class="mono">${esc(c.phone)}</span> · ` : ''}

                      </div>
                    </button>
                    <div class="party-row-right">
                      <div class="party-due-box">

                        <div class="mono ${c.currentDue > 0 ? 'text-red' : 'text-green'}" style="font-size:16px;font-weight:700;">${esc(formatTaka(c.currentDue))}</div>
                      </div>
                      <div class="flex-wrap">
                        <button type="button" class="btn btn-soft btn-icon" data-action="copy-url" data-param="customer" data-id="${esc(c.id)}">${ICONS.copy}</button>
                        <button type="button" class="btn btn-brand-soft btn-sm" data-action="open-party" data-type="customer" data-id="${esc(c.id)}">খাতা দেখুন</button>

                  </div>
                `,

            : invList.length === 0

              : `<div class="list-divide">${invList
                  .map(
                    (inv) => `
                  <div class="party-row">
                    <div>
                      <div style="font-size:12px;color:var(--text-muted);"><span class="mono text-brand" style="font-weight:700;">${esc(inv.invoiceNo)}</span> · ${esc(formatDateBn(inv.date))} · ${toBn((inv.items || []).length)} টি আইটেম</div>
                      <strong style="font-size:16px;">${esc(inv.partyName)}</strong>
                    </div>
                    <div class="party-row-right">
                      <div class="party-due-box" style="font-size:12px;">
                        <div class="mono" style="font-weight:700;font-size:14px;">মোট: ${esc(formatTaka(inv.totalAmount))}</div>
                        <div class="mono ${inv.dueAmount > 0 ? 'text-red' : 'text-green'}">বাকি: ${esc(formatTaka(inv.dueAmount))}</div>
                      </div>
                      <div class="flex-wrap">
                        <button type="button" class="btn btn-soft btn-icon" data-action="copy-url" data-param="invoice" data-id="${esc(inv.id)}">${ICONS.copy}</button>
                        <button type="button" class="btn btn-brand-soft btn-sm" data-action="view-invoice" data-id="${esc(inv.id)}">ইনভয়েস দেখুন</button>
                      </div>
                    </div>
                  </div>
                `,
                  )
                  .join('')}</div>`;

        return `
          <div class="stack-lg">
            <div class="flex-between">
              <div>
                <h1 class="page-title">কাস্টমার খাতা ও ইনভয়েস</h1>
                <p style="margin:4px 0 0;font-size:13.5px;color:var(--text-muted);">মোট কাস্টমার পাওনা: <strong class="mono text-brand">${esc(formatTaka(sum.totalCustomerDue))}</strong></p>
              </div>
              <div class="action-grid-mobile">
                <button type="button" class="btn btn-secondary" data-action="new-party" data-type="customer">${ICONS.plus} নতুন কাস্টমার</button>
                <button type="button" class="btn btn-danger-soft" data-action="new-tx" data-type="customer_due_add">${ICONS.plus} আগের বাকি যোগ</button>
                <button type="button" class="btn btn-primary btn-span-2" data-action="new-tx" data-type="customer_sale">${ICONS.plus} নতুন ইনভয়েস তৈরি</button>

              </div>
            </div>
            <div class="card-flush">${content}</div>
          </div>
        `;
      }

      function renderHomeExpenses() {
        const months = Array.from(
          new Set([getCurrentMonthKey(), ...state.homeExpenses.map((e) => e.monthKey).filter(Boolean)]),
        ).sort((a, b) => b.localeCompare(a));

        const monthFiltered =
          state.expenseMonthFilter === 'all'
            ? state.homeExpenses
            : state.homeExpenses.filter((e) => e.monthKey === state.expenseMonthFilter);

        const q = state.searchQuery.trim().toLowerCase();
        const list = q
          ? monthFiltered.filter(
              (ex) =>
                String(ex.title || '').toLowerCase().includes(q) ||
                String(ex.paidBy || '').toLowerCase().includes(q) ||
                String(ex.note || '').toLowerCase().includes(q) ||
                (ex.items || []).some((it) => String(it.name || '').toLowerCase().includes(q)),
            )
          : monthFiltered;

        const total = monthFiltered.reduce((s, e) => s + Number(e.totalAmount || 0), 0);
        const byMe = monthFiltered.filter((e) => e.paidBy === 'আমি').reduce((s, e) => s + Number(e.totalAmount || 0), 0);
        const byMama = monthFiltered.filter((e) => e.paidBy === 'মাইনু মামা').reduce((s, e) => s + Number(e.totalAmount || 0), 0);
        const perPersonAvg = Math.round(total / 2);

        const cardsHtml = list
          .map((exp) => {
            const itemsList = (exp.items || [])
              .map((it) => `${it.name}${it.qtyText ? ` (${it.qtyText})` : ''} — ${formatTaka(it.amount)}`)
              .join(' · ');
            return `
              <div class="party-row">
                <div style="flex:1;min-width:0;">
                  <div style="font-size:12px;color:var(--text-muted);">${esc(formatDateBn(exp.date))} · পরিশোধ: <strong style="color:var(--text);">${esc(exp.paidBy)}</strong> (${esc(exp.paymentMethod || 'নগদ')})</div>
                  <div style="font-size:16px;font-weight:700;margin-top:2px;">${esc(exp.title)}</div>
                  <div style="font-size:12.5px;color:var(--text-muted);margin-top:4px;">${esc(itemsList)}</div>
                  ${exp.note ? `<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">নোট: ${esc(exp.note)}</div>` : ''}
                </div>
                <div class="party-row-right">
                  <strong class="mono text-red" style="font-size:17px;">${esc(formatTaka(exp.totalAmount))}</strong>
                  <div class="flex-wrap">
                    <button type="button" class="btn btn-soft btn-icon" data-action="edit-expense" data-id="${esc(exp.id)}">${ICONS.edit}</button>
                    <button type="button" class="btn btn-danger-soft btn-icon" data-action="delete-expense" data-id="${esc(exp.id)}">${ICONS.trash}</button>
                  </div>
                </div>
              </div>
            `;
          })
          .join('');

        return `
          <div class="stack-lg">
            <div class="flex-between">
              <div>
                <h1 class="page-title">বাসার খরচ খাতা (আমি ও মাইনু মামা)</h1>
                <p style="margin:4px 0 0;font-size:13.5px;color:var(--text-muted);">প্রতিদিনের বাজার, আগের বকেয়া ও মাসিক বাসার খরচের পূর্ণাঙ্গ হিসাব</p>
              </div>
              <div class="action-grid-mobile">
                <button type="button" class="btn btn-danger-soft" data-action="new-prev-expense">${ICONS.plus} আগের টাকা যোগ</button>
                <button type="button" class="btn btn-primary" data-action="new-expense">${ICONS.plus} নতুন বাজার / খরচ</button>
              </div>
            </div>

            <div class="kpi-grid">
              <div class="card">
                <p class="kpi-label">${state.expenseMonthFilter === 'all' ? 'সর্বমোট বাসার খরচ' : `${esc(formatMonthBn(state.expenseMonthFilter))}-এর মোট খরচ`}</p>
                <p class="kpi-val mono text-red">${esc(formatTaka(total))}</p>
                <p class="kpi-sub">মোট এন্ট্রি: ${toBn(monthFiltered.length)} টি</p>
              </div>
              <div class="card">
                <p class="kpi-label">আমার খরচ</p>
                <p class="kpi-val mono">${esc(formatTaka(byMe))}</p>
                <p class="kpi-sub">নিজ থেকে পরিশোধিত</p>
              </div>
              <div class="card">
                <p class="kpi-label">মাইনু মামার খরচ</p>
                <p class="kpi-val mono text-brand">${esc(formatTaka(byMama))}</p>
                <p class="kpi-sub">মামা থেকে পরিশোধিত</p>
              </div>
              <div class="card">
                <p class="kpi-label">জনপ্রতি গড় (২ জন)</p>
                <p class="kpi-val mono">${esc(formatTaka(perPersonAvg))}</p>
                <p class="kpi-sub">আমি ও মাইনু মামা (অর্ধেক)</p>
              </div>
            </div>

            <div class="flex-between">
              <div style="display:flex;align-items:center;gap:8px;">
                <label class="field-label" style="margin:0;white-space:nowrap;">মাস বাছাই:</label>
                <select class="select" id="expense-month-select" style="width:auto;min-width:150px;">
                  <option value="all" ${state.expenseMonthFilter === 'all' ? 'selected' : ''}>সব মাস</option>
                  ${months.map((m) => `<option value="${esc(m)}" ${m === state.expenseMonthFilter ? 'selected' : ''}>${esc(formatMonthBn(m))}</option>`).join('')}
                </select>
              </div>
              <div class="search-wrap search-compact-desktop">
                ${ICONS.search}
                <input type="search" class="input" id="global-search" value="${esc(state.searchQuery)}" placeholder="কেনা জিনিস বা বাজার খুঁজুন..." />
              </div>
            </div>

            <div class="card-flush">
              ${
                list.length === 0
                  ? `<div class="empty-box" style="margin:16px;">
                      <p style="margin:0 0 12px;">এই মাসে এখনো কোনো বাসার খরচ তোলা হয়নি।</p>
                      <div class="flex-wrap" style="justify-content:center;">
                        <button type="button" class="btn btn-danger-soft btn-sm" data-action="new-prev-expense">${ICONS.plus} আগের টাকা যোগ</button>
                        <button type="button" class="btn btn-primary btn-sm" data-action="new-expense">${ICONS.plus} প্রথম খরচ যোগ করুন</button>
                      </div>
                    </div>`
                  : `<div class="list-divide">${cardsHtml}</div>`
              }
            </div>
          </div>
        `;
      }

      function renderPersons() {
        const selected = state.selectedPersonId
          ? state.persons.find((p) => p.id === state.selectedPersonId) || state.persons[0]
          : state.persons[0];

        if (!selected) {
          return `

          .map(

          .join('');

          </tr>

          .join('');

        const mobilePersonCards = reversedPersonEntries
          .map(
            (e) => `
          <div class="mobile-tx-card">
            <div class="flex-between" style="gap:8px;">
              <span style="font-size:12px;color:var(--text-muted);">${esc(formatDateBn(e.date))}</span>
              <strong class="mono ${e.runningBalance > 0 ? 'text-red' : 'text-green'}" style="font-size:12.5px;">ব্যালেন্স: ${esc(formatTaka(e.runningBalance))}</strong>
            </div>
            <div>
              <div style="font-weight:700;font-size:14px;">${esc(e.purpose)}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${e.type === 'payable_add' ? 'প্রাপ্য যোগ' : 'টাকা প্রদান'} · ${esc(e.paymentMethod)}${e.note ? ` · ${esc(e.note)}` : ''}</div>
            </div>
            <div class="mobile-tx-metrics" style="grid-template-columns:1fr 1fr;">
              <div><div class="mobile-tx-metric-label">প্রাপ্য</div><strong class="mono">${e.payableAmount > 0 ? esc(formatTaka(e.payableAmount)) : '—'}</strong></div>
              <div><div class="mobile-tx-metric-label">প্রদান</div><strong class="mono text-green">${e.givenAmount > 0 ? esc(formatTaka(e.givenAmount)) : '—'}</strong></div>

            <div class="flex-wrap" style="justify-content:flex-end;">
              <button type="button" class="btn btn-soft btn-icon" data-action="edit-person-tx" data-id="${esc(e.ptxId)}">${ICONS.edit}</button>
              <button type="button" class="btn btn-danger-soft btn-icon" data-action="delete-person-tx" data-id="${esc(e.ptxId)}">${ICONS.trash}</button>
            </div>

        return `
          <div class="stack-lg">
            <div class="flex-between">
              <div>
                <h1 class="page-title">মামা, মডারেটর ও ব্যক্তিগত হিসাব</h1>
                <p style="margin:4px 0 0;font-size:13.5px;color:var(--text-muted);">মাইনু মামা, মডারেটর হিমেল এবং অন্যান্য প্রাপকের হিসাব-নিকাশ</p>

            <div class="pill-group">${tabs}</div>

            <div class="card stack-md">
              <div class="flex-between">

                  <span style="font-size:12px;font-weight:600;color:var(--brand);">${esc(selected.role || 'ব্যক্তিগত')}</span>
                  <h2 style="margin:2px 0 0;font-size:21px;font-weight:700;">${esc(selected.name)}</h2>
                  ${selected.phone ? `<div class="mono" style="font-size:13px;color:var(--text-muted);">${esc(selected.phone)}</div>` : ''}
                </div>
                <div class="action-grid-mobile">

                  <button type="button" class="btn btn-secondary" data-action="edit-person" data-id="${esc(selected.id)}">${ICONS.edit} তথ্য</button>
                  <button type="button" class="btn btn-brand-soft" data-action="new-person-tx" data-person="${esc(selected.id)}" data-type="payable_add">${ICONS.plus} প্রাপ্য যোগ</button>
                  <button type="button" class="btn btn-primary btn-span-2" data-action="new-person-tx" data-person="${esc(selected.id)}" data-type="payment_given">${ICONS.plus} টাকা দিন</button>

                <div class="card" style="background:var(--surface-muted);"><div class="kpi-label">বর্তমান বাকি প্রাপ্য</div><div class="kpi-val mono ${ledger.currentBalance > 0 ? 'text-red' : 'text-green'}">${esc(formatTaka(ledger.currentBalance))}</div></div>

              <div class="desktop-only table-wrap">
                <table class="ledger-table">
                  <thead>
                    <tr>
                      <th>তারিখ</th>
                      <th>বিবরণ ও উদ্দেশ্য</th>
                      <th class="num-col">প্রাপ্য</th>
                      <th class="num-col">প্রদান</th>
                      <th class="num-col">ব্যালেন্স</th>

                  </thead>
                  <tbody>${rows || `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-muted);">কোনো এন্ট্রি নেই।</td></tr>`}</tbody>
                </table>
