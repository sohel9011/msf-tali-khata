              <div class="mobile-only">
                ${reversedPersonEntries.length === 0 ? `<div class="empty-box">কোনো এন্ট্রি নেই।</div>` : `<div class="mobile-card-list">${mobilePersonCards}</div>`}
              </div>
            </div>
          </div>
        `;
      }

      // --- Main Render ---
      function render() {
        const root = document.getElementById('app');
        if (!root) return;

        if (isPublicRoute()) {
          root.innerHTML = renderPublicPortal();
          return;
        }

        if (!state.authReady) {
          root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#4b554e;">অ্যাকাউন্ট যাচাই হচ্ছে...</div>`;
          return;
        }

        if (!state.user || !state.isAdmin) {
          root.innerHTML = renderLogin();
          return;
        }

        const activeParty = state.selectedParty
          ? (state.selectedParty.type === 'supplier' ? state.suppliers : state.customers).find(
              (p) => p.id === state.selectedParty.id,
            )
          : null;

        const activeInvoiceTx = state.activeInvoiceId
          ? state.transactions.find((t) => t.id === state.activeInvoiceId)
          : null;

        let activeInvoice = null;
        if (activeInvoiceTx) {
          const isSup =
            activeInvoiceTx.type === 'supplier_purchase' ||
            activeInvoiceTx.type === 'supplier_payment' ||
            activeInvoiceTx.type === 'supplier_due_add';
          const p = (isSup ? state.suppliers : state.customers).find(
            (x) => x.id === activeInvoiceTx.partyId,
          );
          activeInvoice = {
            ...activeInvoiceTx,
            partyType: isSup ? 'supplier' : 'customer',
            partyName: p?.name || activeInvoiceTx.partyName,
            partyPhone: p?.phone || activeInvoiceTx.partyPhone,
            partyAddress: p?.address || activeInvoiceTx.partyAddress,
            partyTotalDue: p?.currentDue ?? activeInvoiceTx.dueAmount,
          };
        }

        const navItems = [
          { id: 'dashboard', label: 'ড্যাশবোর্ড', shortLabel: 'ড্যাশবোর্ড', icon: ICONS.navDashboard },
          { id: 'suppliers', label: 'সাপ্লায়ার', shortLabel: 'সাপ্লায়ার', icon: ICONS.navBook },
          { id: 'customers', label: 'কাস্টমার', shortLabel: 'কাস্টমার', icon: ICONS.navUsers },
          { id: 'home_expenses', label: 'বাসার খরচ', shortLabel: 'বাসা', icon: ICONS.navHome },
          { id: 'persons', label: 'মামা ও হিমেল', shortLabel: 'মামা/স্টাফ', icon: ICONS.navStaff },
        ];

        const isTabActive = (id) => {
          if (activeInvoice) return false;
          if (activeParty) {
            return (id === 'suppliers' && state.selectedParty?.type === 'supplier') ||
              (id === 'customers' && state.selectedParty?.type === 'customer');
          }
          return state.activeTab === id;
        };

        let mainHtml = '';
        if (activeInvoice) mainHtml = renderInvoiceView(activeInvoice, false);
        else if (activeParty && state.selectedParty) mainHtml = renderPartyProfile(activeParty, state.selectedParty.type);
        else if (state.activeTab === 'suppliers') mainHtml = renderSuppliers();
        else if (state.activeTab === 'customers') mainHtml = renderCustomers();
        else if (state.activeTab === 'home_expenses') mainHtml = renderHomeExpenses();
        else if (state.activeTab === 'persons') mainHtml = renderPersons();
        else mainHtml = renderDashboard();

        root.innerHTML = `
          <header class="app-header no-print">
            <div class="container">
              <div class="header-inner">
                <button type="button" class="brand-btn" data-action="switch-tab" data-tab="dashboard">
                  <img src="${LOGO_URL}" alt="এমএস ফ্যাশন" referrerpolicy="no-referrer" class="brand-logo" />
                  <span class="brand-sub">টালি খাতা ও ইনভয়েস</span>
                </button>
                <nav class="nav-tabs">
                  ${navItems
                    .map(
                      (item) => `<button type="button" class="nav-tab ${isTabActive(item.id) ? 'active' : ''}" data-action="switch-tab" data-tab="${item.id}">${item.label}</button>`,
                    )
                    .join('')}
                </nav>
                <div class="header-actions">
                  <button type="button" class="btn btn-primary btn-sm" data-action="new-tx" data-type="customer_sale">${ICONS.plus} নতুন হিসাব</button>
                  <button type="button" class="btn btn-soft btn-icon" title="লগআউট" data-action="sign-out">${ICONS.logout}</button>
                </div>
              </div>
            </div>
          </header>
          <main class="container main-content">${mainHtml}</main>
          <nav class="bottom-nav no-print" aria-label="মোবাইল ন্যাভিগেশন">
            <div class="bottom-nav-grid">
              ${navItems
                .map(
                  (item) => `<button type="button" class="bottom-nav-btn ${isTabActive(item.id) ? 'active' : ''}" data-action="switch-tab" data-tab="${item.id}">${item.icon}<span>${item.shortLabel}</span></button>`,
                )
                .join('')}
            </div>
          </nav>
        `;

        bindChartTooltip();
      }

      function bindChartTooltip() {
        const wrap = document.getElementById('monthly-chart-wrap');
        const tip = document.getElementById('chart-tooltip');
        if (!wrap || !tip) return;
        wrap.querySelectorAll('.chart-bar-group').forEach((g) => {
          const show = (ev) => {
            const month = g.getAttribute('data-month');
            const p = Number(g.getAttribute('data-purchases') || 0);
            const s = Number(g.getAttribute('data-sales') || 0);
            const diff = s - p;
            tip.innerHTML = `
              <div style="font-weight:700;border-bottom:1px solid #f2f4f0;padding-bottom:4px;margin-bottom:6px;">${esc(month)}</div>
              <div class="flex-between"><span>মোট কেনাকাটা</span><strong class="mono">${esc(formatTaka(p))}</strong></div>
              <div class="flex-between"><span>মোট বিক্রি</span><strong class="mono text-brand">${esc(formatTaka(s))}</strong></div>
              <div class="flex-between" style="border-top:1px solid #f2f4f0;margin-top:6px;padding-top:4px;">
                <span>বিক্রি - কেনাকাটা</span>
                <strong class="mono ${diff >= 0 ? 'text-green' : 'text-red'}">${diff > 0 ? '+' : ''}${esc(formatTaka(diff))}</strong>
              </div>
            `;
            tip.style.display = 'block';
            const rect = wrap.getBoundingClientRect();
            const x = Math.min(rect.width - 205, Math.max(8, ev.clientX - rect.left - 80));
            tip.style.left = `${x}px`;
            tip.style.top = '8px';
          };
          g.addEventListener('mouseenter', show);
          g.addEventListener('mousemove', show);
          g.addEventListener('click', show);
          g.addEventListener('mouseleave', () => {
            tip.style.display = 'none';
          });
        });
      }

      // --- Modals ---
      function closeModal() {
        const mr = document.getElementById('modal-root');
        if (mr) mr.innerHTML = '';
      }

      function openPartyModal(partyType, editingId = null) {
        const list = partyType === 'supplier' ? state.suppliers : state.customers;
        const editing = editingId ? list.find((p) => p.id === editingId) : null;
        const isSup = partyType === 'supplier';
        const mr = document.getElementById('modal-root');
        mr.innerHTML = `
          <div class="modal-backdrop" data-action="modal-backdrop">
            <div class="modal-panel modal-sm">
              <div class="flex-between" style="margin-bottom:16px;">
                <h2 style="margin:0;font-size:18px;font-weight:700;">${editing ? (isSup ? 'সাপ্লায়ার তথ্য সম্পাদনা' : 'কাস্টমার তথ্য সম্পাদনা') : (isSup ? 'নতুন সাপ্লায়ার যোগ করুন' : 'নতুন কাস্টমার যোগ করুন')}</h2>
                <button type="button" class="btn btn-soft btn-sm" data-action="close-modal">বন্ধ</button>
              </div>
              <form id="party-form" class="stack-md">
                <div><label class="field-label">নাম *</label><input class="input" id="pf-name" required value="${esc(editing?.name || '')}" /></div>
                <div><label class="field-label">মোবাইল নম্বর</label><input class="input" id="pf-phone" value="${esc(editing?.phone || '')}" /></div>
                <div><label class="field-label">ঠিকানা</label><input class="input" id="pf-address" value="${esc(editing?.address || '')}" /></div>
                ${
                  !editing
                    ? `<div style="background:var(--surface-muted);border:1px solid var(--border);border-radius:12px;padding:12px;">
                        <label class="field-label">শুরুতে আগের বাকি (যদি থাকে)</label>
                        <input type="number" min="0" class="input" id="pf-opening" placeholder="0" />
                      </div>`
                    : ''
                }
                <div class="modal-actions">
                  <button type="button" class="btn btn-soft" data-action="close-modal">বাতিল</button>
                  <button type="submit" class="btn btn-primary" id="pf-submit">সংরক্ষণ করুন</button>
                </div>
              </form>
            </div>
          </div>
        `;
        document.getElementById('party-form').onsubmit = async (e) => {
          e.preventDefault();
          const btn = document.getElementById('pf-submit');
          btn.disabled = true;
          try {
            const uid = auth.currentUser.uid;
            const colName = isSup ? 'suppliers' : 'customers';
            const pubCol = isSup ? 'publicSupplierLedgers' : 'publicCustomerLedgers';
            const id = editing?.id || generateDocId(colName);
            const name = clampString(document.getElementById('pf-name').value, BLUEPRINT_LIMITS.NAME_MAX);
            const phone = clampString(document.getElementById('pf-phone').value, BLUEPRINT_LIMITS.PHONE_MAX);
            const address = clampString(document.getElementById('pf-address').value, BLUEPRINT_LIMITS.ADDRESS_MAX);
            const openingDue = !editing ? Math.max(0, Number(document.getElementById('pf-opening')?.value || 0)) : 0;

            const existingTxs = state.transactions.filter((t) => t.partyId === id);
            let openingTx = null;
            if (!editing && openingDue > 0) {
              openingTx = {
                id: generateDocId('transactions'),
                type: isSup ? 'supplier_due_add' : 'customer_due_add',
                date: getTodayIsoDate(),
                partyId: id,
                partyName: name,
                partyPhone: phone,
                partyAddress: address,
                invoiceNo: 'PREV-1001',
                items: [],
                subtotal: openingDue,
                discount: 0,
                totalAmount: openingDue,
                paidAmount: 0,
                dueAmount: openingDue,
                paymentMethod: 'পূর্বের বাকি',
                note: 'শুরুতে আগের বাকি যোগ',
                ownerUid: uid,
              };
            }

            const ledger = computePartyLedger(openingTx ? [...existingTxs, openingTx] : existingTxs);
            const batch = writeBatch(db);
            const partyRef = doc(db, colName, id);
            if (editing) {
              batch.update(partyRef, { name, phone, address, ...ledgerTotals(ledger), updatedAt: serverTimestamp() });
              for (const tx of existingTxs.slice(0, 100)) {
                batch.update(doc(db, 'transactions', tx.id), {
                  partyName: name,
                  partyPhone: phone,
                  partyAddress: address,
                  updatedAt: serverTimestamp(),
                });
              }
            } else {
              batch.set(partyRef, { id, name, phone, address, ...ledgerTotals(ledger), ownerUid: uid, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
            }
            if (openingTx) {
              batch.set(doc(db, 'transactions', openingTx.id), { ...openingTx, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
            }
            batch.set(doc(db, pubCol, id), {
              id,
              partyType,
              name,
              phone,
              address,
              ...ledgerTotals(ledger),
              shareEnabled: true,
              entries: ledger.entries,
              ownerUid: editing?.ownerUid || uid,
              updatedAt: serverTimestamp(),
            });
            await batch.commit();
            if (editing) {
              const billTxs = existingTxs.filter((t) => t.type === 'customer_sale' || t.type === 'supplier_purchase').slice(0, 50);
              for (const btx of billTxs) {
                try {
                  await updateDoc(doc(db, 'publicInvoices', btx.id), {
                    partyName: name,
                    partyPhone: phone,
                    partyAddress: address,
                    updatedAt: serverTimestamp(),
                  });
                } catch {}
              }
            }
            closeModal();
            showToast('তথ্য সংরক্ষণ করা হয়েছে!');
          } catch (err) {
            showToast(err.message || 'সংরক্ষণ করা যায়নি।', 'error');
            btn.disabled = false;
          }
        };
      }

      function ledgerTotals(l) {
        return { totalBilled: l.totalBilled, totalPaid: l.totalPaid, currentDue: l.currentDue };
      }

      function openTxModal(initialType = 'customer_sale', prePartyId = null, editingTxId = null) {
        const editing = editingTxId ? state.transactions.find((t) => t.id === editingTxId) : null;

          ? editing.items.map((it) => ({ ...it }))
          : [{ name: '', details: '', qty: 1, unitPrice: 0, lineTotal: 0 }];

          const isSup = txType.startsWith('supplier_');

            { id: 'customer_payment', label: 'কাস্টমার টাকা আদায়' },
            { id: 'customer_due_add', label: 'কাস্টমার আগের বাকি যোগ' },
            { id: 'supplier_purchase', label: 'সাপ্লায়ার থেকে মাল ক্রয়' },
            { id: 'supplier_payment', label: 'সাপ্লায়ারকে টাকা পরিশোধ' },
            { id: 'supplier_due_add', label: 'সাপ্লায়ার আগের বাকি / নগদ নেওয়া' },
          ];

          const mr = document.getElementById('modal-root');
          mr.innerHTML = `
            <div class="modal-backdrop" data-action="modal-backdrop">
              <div class="modal-panel">
                <div class="flex-between" style="margin-bottom:16px;">
                  <h2 style="margin:0;font-size:18px;font-weight:700;">${editing ? 'হিসাব সম্পাদনা' : 'নতুন হিসাব এন্ট্রি'}</h2>
                  <button type="button" class="btn btn-soft btn-sm" data-action="close-modal">বন্ধ</button>
                </div>
                <form id="tx-form" class="stack-md">
                  <div class="grid-2">
                    <div>
                      <label class="field-label">লেনদেনের ধরন</label>
                      <select class="select" id="tx-type" ${editing ? 'disabled' : ''}>
                        ${typeOptions.map((o) => `<option value="${o.id}" ${o.id === txType ? 'selected' : ''}>${o.label}</option>`).join('')}
                      </select>
                    </div>
                    <div>
                      <label class="field-label">তারিখ</label>
                      <input type="date" class="input" id="tx-date" value="${esc(editing?.date || getTodayIsoDate())}" required />
                    </div>
                  </div>

                  <div style="background:var(--surface-muted);border:1px solid var(--border);border-radius:12px;padding:12px;">
                    <div class="flex-between" style="margin-bottom:6px;">
                      <label class="field-label" style="margin:0;">${isSup ? 'সাপ্লায়ার নির্বাচন করুন' : 'কাস্টমার নির্বাচন করুন'}</label>
                      <label style="font-size:12px;cursor:pointer;"><input type="checkbox" id="tx-new-party-toggle" /> নতুন নাম যোগ করুন</label>
                    </div>
                    <div id="tx-existing-party-wrap">
                      <select class="select" id="tx-party-id">
                        <option value="">নির্বাচন করুন...</option>
                        ${partyList.map((p) => `<option value="${esc(p.id)}" ${p.id === partyId ? 'selected' : ''}>${esc(p.name)} (বাকি: ${esc(formatTaka(p.currentDue))})</option>`).join('')}
                      </select>
                      ${
                        selectedParty
                          ? `<div style="font-size:12px;color:var(--text-muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;">
                              <span>বর্তমান বাকি: <strong class="mono ${selectedParty.currentDue > 0 ? 'text-red' : 'text-green'}">${esc(formatTaka(selectedParty.currentDue))}</strong></span>
                              ${selectedParty.address ? `<span>· ঠিকানা: ${esc(selectedParty.address)}</span>` : ''}
                            </div>`
                          : ''
                      }
                    </div>
                    <div id="tx-new-party-wrap" style="display:none;margin-top:8px;" class="grid-2">
                      <input class="input" id="tx-new-name" placeholder="নাম *" />
                      <input class="input" id="tx-new-phone" placeholder="মোবাইল নম্বর" />
                      <input class="input" id="tx-new-address" placeholder="ঠিকানা (ঐচ্ছিক)" style="grid-column:1 / -1;" />
                    </div>
                  </div>

                  ${
                    isBill
                      ? `
                    <div>
                      <div class="flex-between" style="margin-bottom:8px;">
                        <label class="field-label" style="margin:0;">পণ্যের বিবরণ</label>
                        <button type="button" class="btn btn-brand-soft btn-sm" id="tx-add-item">${ICONS.plus} আইটেম যোগ</button>
                      </div>
                      <div id="tx-items-list" class="stack-md">
                        ${items
                          .map(
                            (it, i) => `
                          <div class="item-row-grid">
                            <input class="input item-name-field tx-item-name" data-i="${i}" placeholder="পণ্যের নাম *" value="${esc(it.name)}" required />
                            <input type="number" min="1" class="input tx-item-qty" data-i="${i}" placeholder="পিস" value="${it.qty}" required />
                            <input type="number" min="0" class="input tx-item-price" data-i="${i}" placeholder="দর ৳" value="${it.unitPrice}" required />
                            ${items.length > 1 ? `<button type="button" class="btn btn-danger-soft btn-icon tx-rem-item" data-i="${i}">${ICONS.trash}</button>` : '<span></span>'}
                          </div>
                        `,
                          )
                          .join('')}
                      </div>
                    </div>
                    <div class="grid-3">
                      <div><label class="field-label">ছাড় / ডিসকাউন্ট (৳)</label><input type="number" min="0" class="input" id="tx-discount" value="${editing?.discount || 0}" /></div>
                      <div><label class="field-label">নগদ জমা / পরিশোধ (৳)</label><input type="number" min="0" class="input" id="tx-paid" value="${editing?.paidAmount || 0}" /></div>
                      <div><label class="field-label">মাধ্যম</label><select class="select" id="tx-method">${BASE_PAYMENT_METHODS.map((m) => `<option value="${m}" ${(editing?.paymentMethod || 'নগদ') === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
                    </div>
                    <div id="tx-bill-summary" style="font-size:13px;font-weight:700;padding:10px 12px;background:var(--surface-pill);border-radius:10px;"></div>
                  `
                      : isDueAdd
                        ? `
                    <div class="grid-2">
                      <div><label class="field-label">বাকি / টাকার পরিমাণ (৳) *</label><input type="number" min="1" class="input" id="tx-direct-amount" required value="${editing?.totalAmount || ''}" /></div>
                      <div><label class="field-label">মাধ্যম</label><select class="select" id="tx-method">${LEDGER_PAYMENT_METHODS.map((m) => `<option value="${m}" ${(editing?.paymentMethod || 'নগদ') === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
                    </div>
                  `
                        : `
                    <div class="grid-2">
                      <div><label class="field-label">${isSup ? 'পরিশোধকৃত টাকা (৳) *' : 'আদায়কৃত টাকা (৳) *'}</label><input type="number" min="1" class="input" id="tx-paid" required value="${editing?.paidAmount || ''}" /></div>
                      <div><label class="field-label">মাধ্যম</label><select class="select" id="tx-method">${BASE_PAYMENT_METHODS.map((m) => `<option value="${m}" ${(editing?.paymentMethod || 'নগদ') === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
                    </div>
                  `
                  }

                  <div class="grid-2">
                    <div><label class="field-label">ইনভয়েস / চালান নং</label><input class="input" id="tx-inv-no" value="${esc(editing?.invoiceNo || generateInvoiceNo(txType))}" /></div>
                    <div><label class="field-label">নোট / মন্তব্য</label><input class="input" id="tx-note" value="${esc(editing?.note || '')}" placeholder="ঐচ্ছিক বিবরণ..." /></div>
                  </div>

                  <div class="modal-actions">
                    <button type="button" class="btn btn-soft" data-action="close-modal">বাতিল</button>
                    <button type="submit" class="btn btn-primary" id="tx-submit">সংরক্ষণ করুন</button>
                  </div>
                </form>
              </div>
            </div>
          `;

          const updateSummary = () => {
            const sumBox = document.getElementById('tx-bill-summary');
            if (!sumBox) return;
            const sub = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.unitPrice) || 0), 0);
            const disc = Math.max(0, Number(document.getElementById('tx-discount')?.value || 0));
            const tot = Math.max(0, sub - disc);
            const paid = Math.max(0, Number(document.getElementById('tx-paid')?.value || 0));
            sumBox.textContent = `মোট বিল: ${formatTaka(tot)} · জমা: ${formatTaka(paid)} · বাকি: ${formatTaka(tot - paid)}`;
          };
          updateSummary();

          document.getElementById('tx-type')?.addEventListener('change', (e) => {
            const next = e.target.value;
            const wasSup = txType.startsWith('supplier_');
            const nowSup = next.startsWith('supplier_');
            if (wasSup !== nowSup) partyId = '';
            txType = next;
            renderModal();
          });

          document.getElementById('tx-party-id')?.addEventListener('change', (e) => {
            partyId = e.target.value;
          });

          document.getElementById('tx-new-party-toggle')?.addEventListener('change', (e) => {
            const checked = e.target.checked;
            document.getElementById('tx-existing-party-wrap').style.display = checked ? 'none' : 'block';
            document.getElementById('tx-new-party-wrap').style.display = checked ? 'grid' : 'none';
          });

          document.getElementById('tx-add-item')?.addEventListener('click', () => {
            items.push({ name: '', details: '', qty: 1, unitPrice: 0, lineTotal: 0 });
            renderModal();
          });

          document.querySelectorAll('.tx-rem-item').forEach((btn) => {
            btn.addEventListener('click', () => {
              items.splice(Number(btn.getAttribute('data-i')), 1);
              renderModal();
            });
          });

          document.querySelectorAll('.tx-item-name, .tx-item-qty, .tx-item-price').forEach((inp) => {
            inp.addEventListener('input', () => {
              const i = Number(inp.getAttribute('data-i'));
              if (inp.classList.contains('tx-item-name')) items[i].name = inp.value;
              if (inp.classList.contains('tx-item-qty')) items[i].qty = Number(inp.value) || 0;
              if (inp.classList.contains('tx-item-price')) items[i].unitPrice = Number(inp.value) || 0;
              updateSummary();
            });
          });

          document.getElementById('tx-discount')?.addEventListener('input', updateSummary);
          document.getElementById('tx-paid')?.addEventListener('input', updateSummary);

          document.getElementById('tx-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('tx-submit');
            btn.disabled = true;
            try {
              const uid = auth.currentUser.uid;
              const isNew = document.getElementById('tx-new-party-toggle')?.checked;
              const partyCol = isSup ? 'suppliers' : 'customers';
              const pubCol = isSup ? 'publicSupplierLedgers' : 'publicCustomerLedgers';
              let finalPartyId = partyId;
              let partyName = selectedParty?.name || '';
              let partyPhone = selectedParty?.phone || '';
              let partyAddress = selectedParty?.address || '';
              let existingParty = selectedParty;

              if (isNew) {
                partyName = clampString(document.getElementById('tx-new-name').value, BLUEPRINT_LIMITS.NAME_MAX);
                partyPhone = clampString(document.getElementById('tx-new-phone').value, BLUEPRINT_LIMITS.PHONE_MAX);
                partyAddress = clampString(document.getElementById('tx-new-address')?.value || '', BLUEPRINT_LIMITS.ADDRESS_MAX);
                if (!partyName) throw new Error('নাম দিন।');
                finalPartyId = generateDocId(partyCol);
                existingParty = null;
              } else if (!finalPartyId || !existingParty) {
                throw new Error('কাস্টমার বা সাপ্লায়ার নির্বাচন করুন।');
              }

              const cleanItems = isBill
                ? items
                    .filter((it) => String(it.name || '').trim())
                    .slice(0, BLUEPRINT_LIMITS.ITEMS_MAX)
                    .map((it) => {
                      const q = Math.max(0, Number(it.qty) || 0);
                      const up = Math.max(0, Number(it.unitPrice) || 0);
                      return { name: clampString(it.name, 120), details: '', qty: q, unitPrice: up, lineTotal: Math.round(q * up * 100) / 100 };
                    })
                : [];
              if (isBill && cleanItems.length === 0) throw new Error('কমপক্ষে একটি পণ্যের নাম দিন।');

              const directAmt = isDueAdd ? Math.max(0, Number(document.getElementById('tx-direct-amount').value || 0)) : 0;
              if (isDueAdd && directAmt <= 0) throw new Error('সঠিক টাকার পরিমাণ দিন।');

              const subtotal = isBill ? cleanItems.reduce((s, it) => s + it.lineTotal, 0) : isDueAdd ? directAmt : 0;
              const discount = isBill ? Math.max(0, Number(document.getElementById('tx-discount')?.value || 0)) : 0;
              const totalAmount = isBill ? Math.max(0, subtotal - discount) : isDueAdd ? directAmt : 0;
              const paidAmount = isDueAdd ? 0 : Math.max(0, Number(document.getElementById('tx-paid')?.value || 0));
              const dueAmount = isBill || isDueAdd ? totalAmount - paidAmount : 0;

              const txId = editing?.id || generateDocId('transactions');
              const txPayload = {
                id: txId,
                type: txType,
                date: clampString(document.getElementById('tx-date').value, BLUEPRINT_LIMITS.DATE_MAX),
                partyId: finalPartyId,
                partyName,
                partyPhone,
                partyAddress,
                invoiceNo: clampString(document.getElementById('tx-inv-no').value, BLUEPRINT_LIMITS.INVOICE_NO_MAX) || generateInvoiceNo(txType),
                items: cleanItems,
                subtotal,
                discount,
                totalAmount,
                paidAmount,
                dueAmount,
                paymentMethod: clampString(document.getElementById('tx-method').value, BLUEPRINT_LIMITS.PAYMENT_METHOD_MAX),
                note: clampString(document.getElementById('tx-note').value, BLUEPRINT_LIMITS.NOTE_MAX),
                ownerUid: editing?.ownerUid || uid,
              };

              const partyTxs = state.transactions.filter((t) => t.partyId === finalPartyId);
              const nextPartyTxs = editing ? partyTxs.map((t) => (t.id === txId ? txPayload : t)) : [...partyTxs, txPayload];
              const ledger = computePartyLedger(nextPartyTxs);

              const batch = writeBatch(db);
              const partyRef = doc(db, partyCol, finalPartyId);
              if (existingParty) {
                batch.update(partyRef, { name: partyName, phone: partyPhone, address: partyAddress, ...ledgerTotals(ledger), updatedAt: serverTimestamp() });
              } else {
                batch.set(partyRef, { id: finalPartyId, name: partyName, phone: partyPhone, address: partyAddress, ...ledgerTotals(ledger), ownerUid: uid, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
              }

              const txRef = doc(db, 'transactions', txId);
              if (editing) {
                batch.update(txRef, { ...txPayload, updatedAt: serverTimestamp() });
              } else {
                batch.set(txRef, { ...txPayload, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
              }

              batch.set(doc(db, pubCol, finalPartyId), {
                id: finalPartyId,
                partyType: isSup ? 'supplier' : 'customer',
                name: partyName,
                phone: partyPhone,
                address: partyAddress,
                ...ledgerTotals(ledger),
                shareEnabled: true,
                entries: ledger.entries,
                ownerUid: existingParty?.ownerUid || uid,
                updatedAt: serverTimestamp(),
              });

              if (isBill) {
                batch.set(doc(db, 'publicInvoices', txId), {
                  id: txId,
                  invoiceNo: txPayload.invoiceNo,
                  date: txPayload.date,
                  partyType: isSup ? 'supplier' : 'customer',
                  partyId: finalPartyId,
                  partyName,
                  partyPhone,
                  partyAddress,
                  items: txPayload.items,
                  subtotal: txPayload.subtotal,
                  discount: txPayload.discount,
                  totalAmount: txPayload.totalAmount,
                  paidAmount: txPayload.paidAmount,
                  dueAmount: txPayload.dueAmount,
                  partyTotalDue: ledger.currentDue,
                  paymentMethod: txPayload.paymentMethod,
                  note: txPayload.note,
                  shareEnabled: true,
                  ownerUid: uid,
                  createdAt: editing?.createdAt || serverTimestamp(),
                  updatedAt: serverTimestamp(),
                });
              }

              for (const otherTx of partyTxs.filter((t) => t.id !== txId && (t.type === 'customer_sale' || t.type === 'supplier_purchase')).slice(0, 50)) {
                batch.update(doc(db, 'publicInvoices', otherTx.id), {
                  partyName,
                  partyPhone,
                  partyAddress,
                  partyTotalDue: ledger.currentDue,
                  updatedAt: serverTimestamp(),
                });
              }

              await batch.commit();
              closeModal();
              showToast('হিসাব সংরক্ষণ করা হয়েছে!');
            } catch (err) {
              showToast(err.message || 'সংরক্ষণ করা যায়নি।', 'error');
              btn.disabled = false;
            }
          };
        };

        renderModal();
      }

      function openExpenseModal(editingId = null, initialMode = 'detailed') {
        const editing = editingId ? state.homeExpenses.find((e) => e.id === editingId) : null;
        let mode = editing
          ? (editing.paymentMethod === 'পূর্বের হিসাব' || (editing.items && editing.items.length === 1 && editing.items[0].qtyText === 'আগের / সরাসরি হিসাব') ? 'direct' : 'detailed')
          : initialMode;
        let formDate = editing?.date || getTodayIsoDate();
        let formTitle = editing?.title || (mode === 'direct' ? 'পূর্বের বাসার খরচ' : 'দৈনিক বাজার ও বাসার খরচ');
        let formPaidBy = editing?.paidBy || 'আমি';
        let formMethod = editing?.paymentMethod || (mode === 'direct' ? 'পূর্বের হিসাব' : 'নগদ');
        let formNote = editing?.note || '';
        let directAmount = editing ? Number(editing.totalAmount || 0) : '';
        let items = editing?.items?.length ? editing.items.map((it) => ({ ...it })) : [{ name: '', qtyText: '', amount: 0 }];

        const renderModal = () => {
          const mr = document.getElementById('modal-root');
          const totalItems = items.reduce((s, it) => s + (Number(it.amount) || 0), 0);
          mr.innerHTML = `
            <div class="modal-backdrop" data-action="modal-backdrop">
              <div class="modal-panel">
                <div class="flex-between" style="margin-bottom:14px;">
                  <h2 style="margin:0;font-size:18px;font-weight:700;">${editing ? 'বাসার খরচ সম্পাদনা' : 'বাসার খরচ যোগ করুন'}</h2>
                  <button type="button" class="btn btn-soft btn-sm" data-action="close-modal">বন্ধ</button>
                </div>

                <div class="pill-group" style="margin-bottom:14px;width:100%;">
                  <button type="button" class="pill-btn ${mode === 'detailed' ? 'active' : ''}" id="ef-mode-detailed" style="flex:1;">বাজারের তালিকা</button>
                  <button type="button" class="pill-btn ${mode === 'direct' ? 'active' : ''}" id="ef-mode-direct" style="flex:1;">আগের টাকা / সরাসরি খরচ</button>
                </div>

                <form id="exp-form" class="stack-md">
                  <div class="grid-2">
                    <div><label class="field-label">তারিখ *</label><input type="date" class="input" id="ef-date" required value="${esc(formDate)}" /></div>
                    <div><label class="field-label">খরচের শিরোনাম *</label><input class="input" id="ef-title" required placeholder="${mode === 'direct' ? 'যেমন: পূর্বের বাসার খরচ / মেসের বকেয়া' : 'যেমন: দৈনিক বাজার, গ্যাস বিল'}" value="${esc(formTitle)}" /></div>
                  </div>

                  ${
                    mode === 'direct'
                      ? `<div style="background:var(--red-bg);border:1px solid var(--red-border);border-radius:12px;padding:12px;">
                          <label class="field-label" style="color:var(--red);">আগের খরচ বা সরাসরি টাকার পরিমাণ (৳) *</label>
                          <input type="number" min="1" step="any" class="input" id="ef-direct-amt" required placeholder="যেমন: 5000" value="${esc(directAmount)}" style="background:#ffffff;" />
                          <p style="margin:6px 0 0;font-size:11.5px;color:#7f1d1d;">পণ্য বা বাজারের আলাদা লিস্ট না লিখেই সরাসরি আগের মাসের বা পূর্বের মোট বাসার খরচের টাকা এখানে যোগ করতে পারবেন।</p>
                        </div>`
                      : `<div>
                          <div class="flex-between" style="margin-bottom:8px;">
                            <label class="field-label" style="margin:0;">কী কী কেনা হয়েছে</label>
                            <button type="button" class="btn btn-brand-soft btn-sm" id="ef-add-item">${ICONS.plus} আইটেম যোগ</button>
                          </div>
                          <div class="stack-md">
                            ${items
                              .map(
                                (it, i) => `
                              <div class="item-row-grid">
                                <input class="input item-name-field ef-name" data-i="${i}" placeholder="জিনিসের নাম *" value="${esc(it.name)}" required />
                                <input class="input ef-qty" data-i="${i}" placeholder="পরিমাণ" value="${esc(it.qtyText)}" />
                                <input type="number" min="0" step="any" class="input ef-amt" data-i="${i}" placeholder="টাকা ৳ *" value="${it.amount || ''}" required />
                                ${items.length > 1 ? `<button type="button" class="btn btn-danger-soft btn-icon ef-rem" data-i="${i}">${ICONS.trash}</button>` : '<span></span>'}
                              </div>
                            `,
                              )
                              .join('')}
                          </div>
                          <div class="flex-between" style="margin-top:10px;padding:10px 12px;background:var(--surface-pill);border-radius:10px;font-size:13.5px;font-weight:700;">
                            <span>সর্বমোট খরচ</span>
                            <span class="mono text-red" id="ef-live-total">${esc(formatTaka(totalItems))}</span>
                          </div>
                        </div>`
                  }

                  <div class="grid-3">
                    <div>
                      <label class="field-label">কে দিয়েছেন</label>
                      <select class="select" id="ef-paidby">
                        <option value="আমি" ${formPaidBy === 'আমি' ? 'selected' : ''}>আমি</option>
                        <option value="মাইনু মামা" ${formPaidBy === 'মাইনু মামা' ? 'selected' : ''}>মাইনু মামা</option>
                        <option value="যৌথ" ${formPaidBy === 'যৌথ' ? 'selected' : ''}>যৌথ</option>
                      </select>
                    </div>
                    <div>
                      <label class="field-label">মাধ্যম</label>
                      <select class="select" id="ef-method">${EXPENSE_PAYMENT_METHODS.map((m) => `<option value="${m}" ${formMethod === m ? 'selected' : ''}>${m}</option>`).join('')}</select>
                    </div>
                    <div>
                      <label class="field-label">নোট (ঐচ্ছিক)</label>
                      <input class="input" id="ef-note" value="${esc(formNote)}" placeholder="যেমন: আগের হিসাব" />
                    </div>
                  </div>
                  <div class="modal-actions">
                    <button type="button" class="btn btn-soft" data-action="close-modal">বাতিল</button>
                    <button type="submit" class="btn btn-primary" id="ef-submit">সংরক্ষণ করুন</button>
                  </div>
                </form>
              </div>
            </div>
          `;

          const syncCommon = () => {
            formDate = document.getElementById('ef-date')?.value || formDate;
            formTitle = document.getElementById('ef-title')?.value ?? formTitle;
            formPaidBy = document.getElementById('ef-paidby')?.value || formPaidBy;
            formMethod = document.getElementById('ef-method')?.value || formMethod;
            formNote = document.getElementById('ef-note')?.value ?? formNote;
            const dInp = document.getElementById('ef-direct-amt');
            if (dInp) directAmount = dInp.value;
          };

          document.getElementById('ef-mode-detailed').onclick = () => {
            syncCommon();
            mode = 'detailed';
            if (formTitle === 'পূর্বের বাসার খরচ') formTitle = 'দৈনিক বাজার ও বাসার খরচ';
            if (formMethod === 'পূর্বের হিসাব') formMethod = 'নগদ';
            renderModal();
          };
          document.getElementById('ef-mode-direct').onclick = () => {
            syncCommon();
            mode = 'direct';
            if (formTitle === 'দৈনিক বাজার ও বাসার খরচ') formTitle = 'পূর্বের বাসার খরচ';
            if (!editing) formMethod = 'পূর্বের হিসাব';
            renderModal();
          };

          document.getElementById('ef-add-item')?.addEventListener('click', () => {
            syncCommon();
            items.push({ name: '', qtyText: '', amount: 0 });
            renderModal();
          });
          document.querySelectorAll('.ef-rem').forEach((b) => {
            b.onclick = () => {
              syncCommon();
              items.splice(Number(b.getAttribute('data-i')), 1);
              renderModal();
            };
          });
          document.querySelectorAll('.ef-name, .ef-qty, .ef-amt').forEach((inp) => {
            inp.oninput = () => {
              const i = Number(inp.getAttribute('data-i'));
              if (inp.classList.contains('ef-name')) items[i].name = inp.value;
              if (inp.classList.contains('ef-qty')) items[i].qtyText = inp.value;
              if (inp.classList.contains('ef-amt')) items[i].amount = Math.max(0, Number(inp.value) || 0);
              const live = document.getElementById('ef-live-total');
              if (live) live.textContent = formatTaka(items.reduce((s, it) => s + (Number(it.amount) || 0), 0));
            };
          });

          document.getElementById('exp-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('ef-submit');
            btn.disabled = true;
            try {
              const uid = auth.currentUser.uid;
              const id = editing?.id || generateDocId('homeExpenses');
              const date = clampString(document.getElementById('ef-date').value, BLUEPRINT_LIMITS.DATE_MAX);
              const title = clampString(document.getElementById('ef-title').value, BLUEPRINT_LIMITS.TITLE_MAX) || 'বাসার খরচ';

              let cleanItems = [];
              let totalAmount = 0;

              if (mode === 'direct') {
                const amt = Math.max(0, Number(document.getElementById('ef-direct-amt')?.value || 0));
                if (amt <= 0) throw new Error('সঠিক টাকার পরিমাণ লিখুন।');
                totalAmount = amt;
                cleanItems = [
                  {
                    name: clampString(title, 120),
                    qtyText: 'আগের / সরাসরি হিসাব',
                    amount: amt,
                  },
                ];
              } else {
                cleanItems = items
                  .filter((it) => String(it.name || '').trim())
                  .slice(0, BLUEPRINT_LIMITS.ITEMS_MAX)
                  .map((it) => ({
                    name: clampString(it.name, 120),
                    qtyText: clampString(it.qtyText, 60),
                    amount: Math.max(0, Number(it.amount) || 0),
                  }));
                if (cleanItems.length === 0) throw new Error('কমপক্ষে একটি আইটেম দিন।');
                totalAmount = cleanItems.reduce((s, it) => s + it.amount, 0);
              }

              const payload = {
                id,
                date,
                monthKey: date.slice(0, 7),
                title,
                items: cleanItems,
                totalAmount,
                paidBy: clampString(document.getElementById('ef-paidby').value, 60),
                paymentMethod: clampString(document.getElementById('ef-method').value, BLUEPRINT_LIMITS.PAYMENT_METHOD_MAX),
                note: clampString(document.getElementById('ef-note').value, BLUEPRINT_LIMITS.NOTE_MAX),
              };
              const ref = doc(db, 'homeExpenses', id);
              if (editing) await updateDoc(ref, { ...payload, updatedAt: serverTimestamp() });
              else await setDoc(ref, { ...payload, ownerUid: uid, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
              closeModal();
              showToast('বাসার খরচ সংরক্ষণ করা হয়েছে!');
            } catch (err) {
              showToast(err.message || 'সংরক্ষণ করা যায়নি।', 'error');
              btn.disabled = false;
            }
          };
        };
        renderModal();
      }

            <div class="modal-panel modal-sm">
              <h2 style="margin:0 0 8px;font-size:18px;font-weight:700;">${esc(title)}</h2>
              <p style="margin:0 0 18px;font-size:13.5px;color:var(--text-muted);">${esc(message)}</p>
              <div class="modal-actions">
                <button type="button" class="btn btn-soft" data-action="close-modal">বাতিল</button>
                <button type="button" class="btn btn-danger" id="confirm-yes">হ্যাঁ, মুছে ফেলুন</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById('confirm-yes').onclick = async () => {
          const b = document.getElementById('confirm-yes');
          b.disabled = true;
          try {
            await onConfirm();
            closeModal();
          } catch (err) {
            showToast(err?.message || 'মুছতে সমস্যা হয়েছে।', 'error');

          }
        };
      }

      // --- Global Event Delegation ---
      document.addEventListener('input', (e) => {
        if (e.target && e.target.id === 'global-search') {
          state.searchQuery = e.target.value;
          const pos = e.target.selectionStart;
          render();
          const el = document.getElementById('global-search');
          if (el) {
            el.focus();
            if (typeof pos === 'number') el.setSelectionRange(pos, pos);
          }
        }
      });

      document.addEventListener('change', (e) => {
        if (e.target && e.target.id === 'expense-month-select') {
          state.expenseMonthFilter = e.target.value;
          render();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });

      document.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');

        if (action === 'sign-in') {
          state.authError = null;
          state.authLoading = true;
          render();
          try {
            await signInWithPopup(auth, googleProvider);
          } catch (err) {
            const msg = String(err?.message || '');
            if (msg.includes('popup-closed-by-user')) {
              state.authError = 'লগইন উইন্ডোটি বন্ধ করা হয়েছে।';
            } else if (msg.includes('unauthorized-domain')) {
              state.authError = `এই ডোমেইনটি (${window.location.hostname}) এখনো Firebase-এ অনুমোদিত নয়। Firebase Console > Authentication > Settings > Authorized domains-এ গিয়ে "${window.location.hostname}" যোগ করুন।`;
            } else {
              state.authError = 'লগইন করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।';
            }
          } finally {
            state.authLoading = false;
            render();
          }
        } else if (action === 'sign-out') {
          await signOut(auth);
          clearListeners();
          state.selectedParty = null;
          state.activeInvoiceId = null;
          render();
        } else if (action === 'switch-tab') {
          state.activeTab = btn.getAttribute('data-tab') || 'dashboard';
          state.selectedParty = null;
          state.activeInvoiceId = null;
          state.searchQuery = '';
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        } else if (action === 'cust-subtab') {
          state.customerSubTab = btn.getAttribute('data-sub') || 'customers';
          render();
        } else if (action === 'tx-filter') {
          state.txTypeFilter = btn.getAttribute('data-filter') || 'all';
          render();
        } else if (action === 'chart-range') {
          state.chartRangeMonths = Number(btn.getAttribute('data-range')) === 12 ? 12 : 6;
          render();
        } else if (action === 'open-party') {
          state.selectedParty = { id: btn.getAttribute('data-id'), type: btn.getAttribute('data-type') };
          state.activeInvoiceId = null;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        } else if (action === 'close-party') {
          state.selectedParty = null;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        } else if (action === 'view-invoice') {
          state.activeInvoiceId = btn.getAttribute('data-id');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        } else if (action === 'close-invoice') {
          state.activeInvoiceId = null;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        } else if (action === 'print') {
          window.print();
        } else if (action === 'copy-url') {
          const url = buildPublicUrl(btn.getAttribute('data-param'), btn.getAttribute('data-id'));
          await copyText(url, 'শেয়ার লিংক কপি করা হয়েছে!');
        } else if (action === 'wa-invoice') {
          const tx = state.transactions.find((t) => t.id === btn.getAttribute('data-id'));
          if (!tx) return;
          const msg = `আসসালামু আলাইকুম ${tx.partyName},\nএমএস ফ্যাশন থেকে আপনার ইনভয়েস #${tx.invoiceNo} (${formatDateBn(tx.date)})\nমোট বিল: ${formatTaka(tx.totalAmount)}\nজমা: ${formatTaka(tx.paidAmount)}\nবাকি: ${formatTaka(tx.dueAmount)}\nলিংক: ${buildPublicUrl('invoice', tx.id)}`;
          window.location.assign(buildWhatsAppShareUrl(tx.partyPhone, msg));
        } else if (action === 'wa-party') {
          const type = btn.getAttribute('data-type');
          const id = btn.getAttribute('data-id');
          const p = (type === 'supplier' ? state.suppliers : state.customers).find((x) => x.id === id);
          if (!p) return;
          const msg = `আসসালামু আলাইকুম ${p.name},\nএমএস ফ্যাশনে আপনার বর্তমান বাকি/ব্যালেন্স: ${formatTaka(p.currentDue)}\nবিস্তারিত খাতা দেখুন: ${buildPublicUrl(type, id)}`;
          window.location.assign(buildWhatsAppShareUrl(p.phone, msg));
        } else if (action === 'wa-person') {
          const p = state.persons.find((x) => x.id === btn.getAttribute('data-id'));
          if (!p) return;
          const msg = `আসসালামু আলাইকুম ${p.name},\nএমএস ফ্যাশন থেকে আপনার হিসাবের বর্তমান ব্যালেন্স: ${formatTaka(p.currentBalance)}\nলিংক: ${buildPublicUrl('person', p.id)}`;
          window.location.assign(buildWhatsAppShareUrl(p.phone, msg));
        } else if (action === 'exit-public') {
          window.history.pushState({}, '', window.location.origin + window.location.pathname);
          state.queryParams = readQueryParams();
          if (state.isAdmin) attachAdminListeners();
          render();
        } else if (action === 'download-pdf') {
          await exportMonthlyPdf();
        } else if (action === 'close-modal') {
          closeModal();
        } else if (action === 'modal-backdrop') {
          if (e.target === btn) closeModal();
        } else if (action === 'new-party') {
          openPartyModal(btn.getAttribute('data-type'));
        } else if (action === 'edit-party') {
          openPartyModal(btn.getAttribute('data-type'), btn.getAttribute('data-id'));
        } else if (action === 'new-tx') {
          openTxModal(btn.getAttribute('data-type') || 'customer_sale', btn.getAttribute('data-party'));
        } else if (action === 'edit-tx') {
          openTxModal('customer_sale', null, btn.getAttribute('data-id'));
        } else if (action === 'delete-tx') {
          const tx = state.transactions.find((t) => t.id === btn.getAttribute('data-id'));
          if (!tx) return;
          openConfirmModal('লেনদেন মুছে ফেলবেন?', `${tx.partyName} — ${formatTaka(tx.totalAmount || tx.paidAmount)} এন্ট্রিটি স্থায়ীভাবে মুছে যাবে।`, async () => {
            const isSup = tx.type.startsWith('supplier_');
            const party = (isSup ? state.suppliers : state.customers).find((p) => p.id === tx.partyId);
            const remaining = state.transactions.filter((t) => t.partyId === tx.partyId && t.id !== tx.id);
            const ledger = computePartyLedger(remaining);
            const batch = writeBatch(db);
            batch.delete(doc(db, 'transactions', tx.id));
            if (tx.type === 'customer_sale' || tx.type === 'supplier_purchase') {
              batch.delete(doc(db, 'publicInvoices', tx.id));
            }
            if (party) {
              batch.update(doc(db, isSup ? 'suppliers' : 'customers', party.id), { ...ledgerTotals(ledger), updatedAt: serverTimestamp() });
              batch.set(doc(db, isSup ? 'publicSupplierLedgers' : 'publicCustomerLedgers', party.id), {
                id: party.id,
                partyType: isSup ? 'supplier' : 'customer',
                name: party.name,
                phone: party.phone,
                address: party.address,
                ...ledgerTotals(ledger),
                shareEnabled: true,
                entries: ledger.entries,
                ownerUid: party.ownerUid || auth.currentUser.uid,
                updatedAt: serverTimestamp(),
              });
              for (const otherTx of remaining.filter((t) => t.type === 'customer_sale' || t.type === 'supplier_purchase').slice(0, 50)) {
                batch.update(doc(db, 'publicInvoices', otherTx.id), {
                  partyTotalDue: ledger.currentDue,
                  updatedAt: serverTimestamp(),
                });
              }
            }
            await batch.commit();
            showToast('লেনদেন মুছে ফেলা হয়েছে।');
          });
        } else if (action === 'delete-party') {
          const type = btn.getAttribute('data-type');
          const id = btn.getAttribute('data-id');
          const isSup = type === 'supplier';
          const p = (isSup ? state.suppliers : state.customers).find((x) => x.id === id);
          openConfirmModal('খাতা মুছে ফেলবেন?', `${p?.name || ''}-এর সম্পূর্ণ খাতা এবং সব লেনদেন স্থায়ীভাবে মুছে যাবে।`, async () => {
            const batch = writeBatch(db);
            batch.delete(doc(db, isSup ? 'suppliers' : 'customers', id));
            batch.delete(doc(db, isSup ? 'publicSupplierLedgers' : 'publicCustomerLedgers', id));
            for (const tx of state.transactions.filter((t) => t.partyId === id).slice(0, 200)) {
              batch.delete(doc(db, 'transactions', tx.id));
              if (tx.type === 'customer_sale' || tx.type === 'supplier_purchase') {
                batch.delete(doc(db, 'publicInvoices', tx.id));
              }
            }
            await batch.commit();
            state.selectedParty = null;
            showToast('খাতা ও লেনদেন মুছে ফেলা হয়েছে।');
            render();
          });
        } else if (action === 'new-expense') {
          openExpenseModal(null, 'detailed');
        } else if (action === 'new-prev-expense') {
          openExpenseModal(null, 'direct');
        } else if (action === 'edit-expense') {
          openExpenseModal(btn.getAttribute('data-id'));
        } else if (action === 'delete-expense') {
          const id = btn.getAttribute('data-id');
          openConfirmModal('খরচ মুছে ফেলবেন?', 'এই বাসার খরচের হিসাবটি স্থায়ীভাবে মুছে যাবে।', async () => {
            await deleteDoc(doc(db, 'homeExpenses', id));
            showToast('খরচ মুছে ফেলা হয়েছে।');
          });
        } else if (action === 'select-person') {
          state.selectedPersonId = btn.getAttribute('data-id');
          render();
        } else if (action === 'new-person') {
          openPersonModal();
        } else if (action === 'edit-person') {
          openPersonModal(btn.getAttribute('data-id'));
        } else if (action === 'new-person-tx') {
          openPersonTxModal(btn.getAttribute('data-person'), btn.getAttribute('data-type'));
        } else if (action === 'edit-person-tx') {
          openPersonTxModal(null, 'payment_given', btn.getAttribute('data-id'));
        } else if (action === 'delete-person-tx') {
          const ptx = state.personTransactions.find((t) => t.id === btn.getAttribute('data-id'));
          if (!ptx) return;
          openConfirmModal('এন্ট্রি মুছে ফেলবেন?', `${ptx.purpose} (${formatTaka(ptx.amount)}) এন্ট্রিটি মুছে যাবে।`, async () => {
            const person = state.persons.find((p) => p.id === ptx.personId);
            const remaining = state.personTransactions.filter((t) => t.personId === ptx.personId && t.id !== ptx.id);
            const ledger = computePersonLedger(remaining);
            const batch = writeBatch(db);
            batch.delete(doc(db, 'personTransactions', ptx.id));
            if (person) {
              batch.update(doc(db, 'persons', person.id), {
                totalPayable: ledger.totalPayable,
                totalGiven: ledger.totalGiven,
                currentBalance: ledger.currentBalance,
                updatedAt: serverTimestamp(),
              });
              batch.set(doc(db, 'publicPersonLedgers', person.id), {
                id: person.id,
                name: person.name,
                phone: person.phone,
                role: person.role,
                totalPayable: ledger.totalPayable,
                totalGiven: ledger.totalGiven,
                currentBalance: ledger.currentBalance,
                shareEnabled: true,
                entries: ledger.entries,
                ownerUid: person.ownerUid || auth.currentUser.uid,
                updatedAt: serverTimestamp(),
              });
            }
            await batch.commit();
            showToast('এন্ট্রি মুছে ফেলা হয়েছে।');
          });
        }
      });
    </script>
  </body>
</html>
